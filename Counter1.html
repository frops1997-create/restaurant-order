<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter - Payment & Orders</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<!-- 新增：Excel导出依赖库 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
* { box-sizing: border-box; font-family: Arial; }
body { margin: 0; padding: 20px; }

body::before {
  content:"";
  position:fixed;
  width:100%; height:100%;
  background:url("https://images.unsplash.com/photo-1546069901-ba9599a7e63c") center/cover;
  opacity:0.65;
  z-index:-1;
}

#loginPage {
  max-width:400px; margin:150px auto;
  background:white; padding:25px;
  border-radius:12px; text-align:center;
}
#loginPage input { width:100%; padding:10px; margin:10px 0; }
#loginPage button { padding:10px 20px; }

.container { max-width:900px; margin:auto; display:none; }

.order-box {
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}
.order-table { font-size:18px; font-weight:bold; color:#0066cc; }
.total { color:#27ae60; font-weight:bold; font-size:16px; margin:8px 0; }

.done-btn { background:#27ae60; color:white; padding:6px 10px; border:none; }
.cancel-btn { background:#c0392b; color:white; padding:6px 10px; border:none; margin-left:5px; }

.top-buttons {
  text-align:center;
  margin-bottom:15px;
}
.top-buttons button {
  margin:5px;
  padding:8px 12px;
}
.clear-btn { background:#e74c3c; color:white; padding:8px 12px; border:none; }
/* 新增：导出按钮样式 */
.export-btn { background:#3498db; color:white; padding:8px 12px; border:none; }

.modal-overlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.6); z-index:999; display:none;
}
.modal-box {
  background:white; padding:30px; border-radius:12px;
  max-width:400px; margin:150px auto; text-align:center;
}
.modal-box input {
  width:100%; padding:12px; margin:15px 0;
  border:1px solid #ccc; border-radius:8px;
}
.modal-btn {
  padding:10px 20px; margin:5px; border:none; border-radius:6px;
}
.btn-confirm { background:#e74c3c; color:white; }
.btn-cancel { background:#95a5a6; color:white; }
</style>
</head>

<body>

<div id="loginPage">
  <h2>🔐 Counter Login</h2>
  <input type="password" id="password" placeholder="Enter Password">
  <button onclick="login()">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<div class="modal-overlay" id="clearModal">
  <div class="modal-box">
    <h3>🔒 Clear History Confirm</h3>
    <p>Enter Admin Password to Clear All History</p>
    <input type="password" id="clearPwd" placeholder="Enter Password">
    <div style="color:red; margin-bottom:10px; display:none;" id="clearError">Wrong Password!</div>
    <button class="modal-btn btn-confirm" onclick="verifyClearPwd()">Confirm Clear</button>
    <button class="modal-btn btn-cancel" onclick="closeClearModal()">Cancel</button>
  </div>
</div>

<div class="container" id="mainPage">
  <h1>Counter System</h1>

  <div class="top-buttons">
    <button onclick="viewMode='current';loadOrders()">🟢 Current Orders</button>
    <button onclick="viewMode='history';loadOrders()">📜 History Orders</button>
    <!-- 新增：导出Excel按钮 -->
    <button onclick="viewMode='cancelled';loadOrders()">❌ Cancelled Orders</button>
    <button class="export-btn" onclick="exportHistoryToExcel()">📊 Download History Excel</button>
    <button class="clear-btn" onclick="openClearModal()">🗑️ Clear All History</button>
  </div>

  <div id="orderList"></div>
</div>

<script>
const PASSWORD = "1234";
let viewMode = "current";

function login(){
  if(document.getElementById("password").value === PASSWORD){
    loginPage.style.display="none";
    mainPage.style.display="block";
    loadOrders();
  } else {
    error.innerText="Wrong Password!";
  }
}

function openClearModal() {
  document.getElementById("clearModal").style.display = "block";
  document.getElementById("clearPwd").value = "";
  document.getElementById("clearError").style.display = "none";
}

function closeClearModal() {
  document.getElementById("clearModal").style.display = "none";
}

function verifyClearPwd() {
  const inputPwd = document.getElementById("clearPwd").value;
  if (inputPwd === PASSWORD) {
    closeClearModal();
    clearAllHistory();
  } else {
    document.getElementById("clearError").style.display = "block";
  }
}

const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs",
  storageBucket: "restaurants-cs.firebasestorage.app",
  messagingSenderId: "209872919844",
  appId: "1:209872919844:web:c1730801cd51d615e867b1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const priceList = {
  "Fried Rice": 8, "Beef Noodles": 10, "BBQ Pork": 12,
  "BBQ Chicken": 15, "BBQ Salmon": 18, "Nasi Lemak Curry": 13,
  "Nasi Lemak Chicken": 12, "Nasi Lemak Egg": 9
};

function clearAllHistory() {
  if (!confirm("⚠️ Confirm clear ALL history & cancelled?")) return;
  db.ref("historyOrders").remove();
  db.ref("cancelledOrders").remove();
  alert("✅ Cleared!");
  loadOrders();
}

function loadOrders(){
  let path = "orders";
  if(viewMode==="history") path="historyOrders";
  if(viewMode==="cancelled") path="cancelledOrders";

  db.ref(path).on("value", snap=>{
    const data = snap.val();
    const list = document.getElementById("orderList");
    list.innerHTML = "";

    if(!data) {
      list.innerHTML = "<div>No Orders</div>";
      return;
    }

    for(let id in data){
      const o = data[id];
      console.log("Order from DB:", o);
      console.log("Table No:", o.tableNo, o.TableNo, o.table, o.Table);

      let total = 0;
      let html = "";

      if(o.items){
        o.items.forEach(item=>{
          let p = typeof item==="object" ? (item.price||0) : (priceList[item]||0);
          total += p;
          html += `${item.name||item} - $${p.toFixed(2)}<br>`;
        });
      }
      if(o.total) total = parseFloat(o.total);

      const div = document.createElement("div");
      div.className = "order-box";

      const tableDisplay =
        o.tableNo || o.TableNo || o.table || o.Table || "?";

      div.innerHTML = `
        <div class="order-table">
          Order #${o.orderNo} | Table ${tableDisplay}
        </div>
        <div>${html}</div>
        <div class="total">✅ TOTAL BILL: $${total.toFixed(2)}</div>
        <div>${o.time}</div>
        ${viewMode==="current" ? `
          <button class="done-btn" onclick="complete('${id}')">✅ Complete</button>
          <button class="cancel-btn" onclick="cancelOrder('${id}')">❌ Cancel</button>
        ` : ""}
      `;
      list.appendChild(div);
    }
  });
}

function complete(id){
  if(confirm("Complete?")){
    db.ref("orders/"+id).once("value",s=>{
      db.ref("historyOrders/"+id).set(s.val());
      db.ref("orders/"+id).remove();
    });
  }
}

function cancelOrder(id){
  if(confirm("Cancel?")){
    db.ref("orders/"+id).once("value",s=>{
      db.ref("cancelledOrders/"+id).set(s.val());
      db.ref("orders/"+id).remove();
    });
  }
}

// 新增：导出历史记录为Excel文件
async function exportHistoryToExcel() {
  if (!confirm("📊 Export All History & Cancelled Orders to Excel?")) return;
  
  try {
    // 1. 获取历史订单 + 取消订单
    const historySnap = await db.ref("historyOrders").once("value");
    const cancelledSnap = await db.ref("cancelledOrders").once("value");
    
    const historyData = historySnap.val() || {};
    const cancelledData = cancelledSnap.val() || {};
    
    const excelData = [];
    
    // 处理已完成订单
    for (let id in historyData) {
      const order = historyData[id];
      const items = order.items ? order.items.map(i => i.name || i).join(", ") : "No Items";
      const total = order.total || 0;
      const table = order.tableNo || order.TableNo || order.table || order.Table || "?";
      
      excelData.push({
        "Order No": order.orderNo || "N/A",
        "Table No": table,
        "Items": items,
        "Total Amount": `$${parseFloat(total).toFixed(2)}`,
        "Time": order.time || "N/A",
        "Status": "Completed"
      });
    }
    
    // 处理已取消订单
    for (let id in cancelledData) {
      const order = cancelledData[id];
      const items = order.items ? order.items.map(i => i.name || i).join(", ") : "No Items";
      const total = order.total || 0;
      const table = order.tableNo || order.TableNo || order.table || order.Table || "?";
      
      excelData.push({
        "Order No": order.orderNo || "N/A",
        "Table No": table,
        "Items": items,
        "Total Amount": `$${parseFloat(total).toFixed(2)}`,
        "Time": order.time || "N/A",
        "Status": "Cancelled"
      });
    }
    
    if (excelData.length === 0) {
      alert("❌ No history data to export!");
      return;
    }
    
    // 2. 创建Excel工作表
    const ws = XLSX.utils.json_to_sheet(excelData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Order History");
    
    // 3. 下载文件
    const fileName = `Order_History_${new Date().toLocaleDateString()}.xlsx`;
    XLSX.writeFile(wb, fileName);
    
    alert(`✅ Export successful!\nFile: ${fileName}`);
  } catch (error) {
    alert("❌ Export failed: " + error.message);
  }
}
</script>

</body>
</html>
