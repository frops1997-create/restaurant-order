<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter - Payment & Orders</title>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<style>
  * {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }
  body {
    background: #f5f5f5;
    padding: 20px;
    margin: 0;
  }
  .container {
    max-width: 900px;
    margin: auto;
  }
  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
  }
  .order-box {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .order-table {
    font-size: 20px;
    font-weight: bold;
    color: #0066cc;
    margin-bottom: 8px;
  }
  .order-items {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .price {
    color: #d35400;
    font-weight: bold;
  }
  .total {
    font-size: 18px;
    font-weight: bold;
    color: #27ae60;
    margin: 10px 0;
  }
  .time {
    font-size: 13px;
    color: #777;
    margin-bottom: 10px;
  }
  .done-btn {
    background: #27ae60;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .done-btn:hover {
    background: #219653;
  }
  .no-order {
    text-align: center;
    font-size: 18px;
    color: #666;
    padding: 40px 0;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Counter - Orders & Payment</h1>
  <div id="orderList"></div>
</div>

<script>
// 🔥 直接用你现有的 Firebase，完全通用
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs",
  storageBucket: "restaurants-cs.firebasestorage.app",
  messagingSenderId: "209872919844",
  appId: "1:209872919844:web:c1730801cd51d615e867b1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 菜品价格表（自动计算价格）
const priceList = {
  "Fried Rice - $8": 8,
  "Beef Noodles - $10": 10,
  "BBQ Pork - $12": 12,
  "BBQ Chicken - $15": 15,
  "BBQ Salmon - $18": 18,
  "Nasi Lemak Curry - $13": 13,
  "Nasi Lemak Chicken - $12": 12,
  "Nasi Lemak Egg - $9": 9
};

// 实时加载订单
function loadCounterOrders() {
  db.ref('orders').on('value', (snapshot) => {
    const data = snapshot.val();
    const list = document.getElementById('orderList');
    list.innerHTML = '';

    if (!data) {
      list.innerHTML = '<div class="no-order">No Orders Yet</div>';
      return;
    }

    for (let orderId in data) {
      const o = data[orderId];

      // 自动计算总价（兼容所有订单）
      let total = 0;
      let itemHtml = '';

      o.items.forEach(item => {
        const price = priceList[item] || 0;
        total += price;
        itemHtml += `${item} <span class="price">$${price.toFixed(2)}</span><br>`;
      });

      // 渲染柜台显示样式
      const div = document.createElement('div');
      div.className = 'order-box';
      div.innerHTML = `
        <div class="order-table">Table ${o.table}</div>
        <div class="order-items">${itemHtml}</div>
        <div class="total">TOTAL PAYMENT: $${total.toFixed(2)}</div>
        <div class="time">Time: ${o.time}</div>
        <button class="done-btn" onclick="complete('${orderId}')">✅ Order Completed</button>
      `;
      list.appendChild(div);
    }
  });
}

// 完成订单
function complete(orderId) {
  if(confirm("Mark this order as completed?")){
    db.ref('orders/' + orderId).remove();
  }
}

loadCounterOrders();
</script>

</body>
</html>
