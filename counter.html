<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter - Payment & Orders</title>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<style>
  * {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }
  body {
    margin: 0;
    padding: 20px;
    position: relative;
  }

  /* 半透明美食背景 */
  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("https://img0.baidu.com/it/u=889623208,250419972&fm=253&fmt=auto&app=138&f=JPEG");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.15; /* 透明度，越小越淡 */
    z-index: -1;
  }

  .container {
    max-width: 900px;
    margin: auto;
    position: relative;
    z-index: 1;
  }
  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
  }
  .order-box {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .order-table {
    font-size: 20px;
    font-weight: bold;
    color: #0066cc;
    margin-bottom: 8px;
  }
  .order-items {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .price {
    color: #d35400;
    font-weight: bold;
  }
  .total {
    font-size: 18px;
    font-weight: bold;
    color: #27ae60;
    margin: 10px 0;
  }
  .time {
    font-size: 13px;
    color: #777;
    margin-bottom: 10px;
  }
  .done-btn {
    background: #27ae60;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .done-btn:hover {
    background: #219653;
  }
  .no-order {
    text-align: center;
    font-size: 18px;
    color: #666;
    padding: 40px 0;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Counter - Orders & Payment</h1>
  <div id="orderList"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs",
  storageBucket: "restaurants-cs.firebasestorage.app",
  messagingSenderId: "209872919844",
  appId: "1:209872919844:web:c1730801cd51d615e867b1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const priceList = {
  "1)Fried Rice - $8": 8,
  "2) Beef Noodles - $10": 10,
  "3) BBQ Pork - $12": 12,
  "4) BBQ Chicken - $15": 15,
  "5) BBQ Salmon - $18": 18,
  "6) Nasi Lemak Curry - $13": 13,
  "7) Nasi Lemak Chicken - $12": 12,
  "8) Nasi Lemak Egg - $9": 9
};

function loadCounterOrders() {
  db.ref('orders').on('value', (snapshot) => {
    const data = snapshot.val();
    const list = document.getElementById('orderList');
    list.innerHTML = '';

    if (!data) {
      list.innerHTML = '<div class="no-order">No Orders Yet</div>';
      return;
    }

    for (let orderId in data) {
      const o = data[orderId];

      let total = 0;
      let itemHtml = '';

      o.items.forEach(item => {
        const price = priceList[item] || 0;
        total += price;
        itemHtml += `${item} <span class="price">$${price.toFixed(2)}</span><br>`;
      });

      const div = document.createElement('div');
      div.className = 'order-box';
      div.innerHTML = `
        <div class="order-table">Table ${o.table}</div>
        <div class="order-items">${itemHtml}</div>
        <div class="total">TOTAL PAYMENT: $${total.toFixed(2)}</div>
        <div class="time">Time: ${o.time}</div>
        <button class="done-btn" onclick="complete('${orderId}')">✅ Order Completed</button>
      `;
      list.appendChild(div);
    }
  });
}

function complete(orderId) {
  if(confirm("Mark this order as completed?")){
    db.ref('orders/' + orderId).remove();
  }
}

loadCounterOrders();
</script>

</body>
</html>
