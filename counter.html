<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter - Payment & Orders</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
* { box-sizing: border-box; font-family: Arial; }
body { margin: 0; padding: 20px; }

/* 背景 */
body::before {
  content:"";
  position:fixed;
  width:100%; height:100%;
  background:url("https://images.unsplash.com/photo-1546069901-ba9599a7e63c") center/cover;
  opacity:0.65;
  z-index:-1;
}

/* 登录 */
#loginPage {
  max-width:400px; margin:150px auto;
  background:white; padding:25px;
  border-radius:12px; text-align:center;
}
#loginPage input { width:100%; padding:10px; margin:10px 0; }
#loginPage button { padding:10px 20px; }

/* 主页面 */
.container { max-width:900px; margin:auto; display:none; }

.order-box {
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}
.order-table { font-size:18px; font-weight:bold; color:#0066cc; }
.price { color:#d35400; }
.total { color:#27ae60; font-weight:bold; }

.done-btn { background:#27ae60; color:white; padding:6px 10px; border:none; }
.cancel-btn { background:#c0392b; color:white; padding:6px 10px; border:none; margin-left:5px; }

.top-buttons {
  text-align:center;
  margin-bottom:15px;
}
.top-buttons button {
  margin:5px;
  padding:8px 12px;
}
</style>
</head>

<body>

<!-- 登录 -->
<div id="loginPage">
  <h2>🔐 Counter Login</h2>
  <input type="password" id="password" placeholder="Enter Password">
  <button onclick="login()">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<!-- 主页面 -->
<div class="container" id="mainPage">
  <h1>Counter System</h1>

  <div class="top-buttons">
    <button onclick="viewMode='current';loadOrders()">🟢 Current Orders</button>
    <button onclick="viewMode='history';loadOrders()">📜 History Orders</button>
    <button onclick="viewMode='cancelled';loadOrders()">❌ Cancelled Orders</button>
  </div>

  <div id="orderList"></div>
</div>

<script>
const PASSWORD = "1234";
let viewMode = "current";

function login(){
  if(document.getElementById("password").value === PASSWORD){
    loginPage.style.display="none";
    mainPage.style.display="block";
    loadOrders();
  } else {
    error.innerText="Wrong Password!";
  }
}

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 菜单价格 */
const priceList = {
  "1) Roasted Chicken Drumstick 烧鸡腿饭 - $7.00": 7.00,
  "2) Roasted Chicken Rice 烧鸡饭- $6.20": 6.20,
  "3) Roasted Duck Rice 烧鸭饭 - $6.50": 6.50,
  "4) Roasted Pork Rice 烧肉饭 - $6.80": 6.80,
  "5) Char Siew Rice 叉烧饭 - $6.50": 6.50,
  "6) Char Siew Wanton Noodle 叉烧云台面 - $6.70": 6.70,
  "7) Roasted Chicken & Roasted Pork Rice 烧鸡烧肉饭 -$7.20": 7.20,
  "8) Wanton Soup 云台汤 -$6.00": 6,
  "9) Roasted Pork 烧肉 -$5.50": 5.50,
  "10) Roasted Duck 烧鸭肉 -$5.70": 5.70,
};

/* 加载订单 */
function loadOrders(){
  let path = "orders";
  if(viewMode==="history") path="history_orders";
  if(viewMode==="cancelled") path="cancelled_orders";

  db.ref(path).on("value", snap=>{
    const data = snap.val();
    const list = document.getElementById("orderList");
    list.innerHTML="";

    if(!data){
      list.innerHTML="<div>No Orders</div>";
      return;
    }

    for(let id in data){
      const o = data[id];

      let total=0, html="";
      o.items.forEach(item=>{
        const p = priceList[item]||0;
        total+=p;
        html+=`${item} - $${p}<br>`;
      });

      const div = document.createElement("div");
      div.className="order-box";

      div.innerHTML=`
        <div class="order-table">Order #${o.orderNo} | Table ${o.table}</div>
        <div>${html}</div>
        <div class="total">TOTAL: $${total}</div>
        <div>${o.time}</div>
        ${viewMode==="current" ? `
          <button class="done-btn" onclick="complete('${id}')">✅ Complete</button>
          <button class="cancel-btn" onclick="cancelOrder('${id}')">❌ Cancel</button>
        `:""}
      `;

      list.appendChild(div);
    }
  });
}

/* 完成订单 → history */
function complete(id){
  if(confirm("Complete this order?")){
    db.ref("orders/"+id).once("value", snap=>{
      db.ref("history_orders/"+id).set(snap.val());
      db.ref("orders/"+id).remove();
    });
  }
}

/* 取消订单 → cancelled */
function cancelOrder(id){
  if(confirm("Cancel this order?")){
    db.ref("orders/"+id).once("value", snap=>{
      db.ref("cancelled_orders/"+id).set(snap.val());
      db.ref("orders/"+id).remove();
    });
  }
}
</script>

</body>
</html>
