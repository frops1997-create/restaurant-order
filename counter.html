<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>收银柜台系统</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft YaHei", sans-serif;
}

body {
  position: relative;
  min-height: 100vh;
  color: #333;
  padding: 20px;
}

/* 半透明美食背景 */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url("https://img0.baidu.com/it/u=889623208,250419972&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=500");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.18; /* 透明度，越小越淡 */
  z-index: -1;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.92);
  border-radius: 10px;
  padding: 25px;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
  margin-bottom: 20px;
  color: #c72e2e;
}

.table-area {
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
}

th, td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: center;
}

th {
  background: #f8f8f8;
}

.btns {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

button {
  padding: 10px 16px;
  border: none;
  border-radius: 6px;
  background: #c72e2e;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:hover {
  background: #a82424;
}

.total {
  font-size: 20px;
  font-weight: bold;
  text-align: right;
  color: #c72e2e;
}
</style>
</head>

<body>
<div class="container">
  <h1>美食柜台收银系统</h1>

  <div class="btns">
    <button>新增菜品</button>
    <button>删除选中</button>
    <button>清空订单</button>
    <button>结账收款</button>
  </div>

  <div class="table-area">
    <table>
      <tr>
        <th>序号</th>
        <th>菜品名称</th>
        <th>单价</th>
        <th>数量</th>
        <th>小计</th>
      </tr>
      <tr>
        <td>1</td>
        <td>汉堡套餐</td>
        <td>28</td>
        <td>1</td>
        <td>28</td>
      </tr>
      <tr>
        <td>2</td>
        <td>炸鸡</td>
        <td>22</td>
        <td>1</td>
        <td>22</td>
      </tr>
    </table>
  </div>

  <div class="total">
    合计：¥50.00
  </div>
</div>
</body>
</html>
