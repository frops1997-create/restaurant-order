<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Counter (Login Protected)</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;background:#eee;margin:0}

/* 登录页面 */
#loginBox{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login{
  background:white;
  padding:30px;
  border-radius:10px;
  text-align:center;
}

/* 主系统 */
#app{
  display:none;
  padding:20px;
}

.order{
  background:white;
  padding:10px;
  margin:5px;
}

.total{
  background:black;
  color:white;
  padding:15px;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- 🔐 登录页面 -->
<div id="loginBox">
  <div class="login">
    <h2>Counter Login</h2>
    <input type="password" id="password" placeholder="Enter Password"><br><br>
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- 💰 柜台系统 -->
<div id="app">
  <h2>Counter System</h2>
  <div id="orders"></div>
  <div class="total" id="total"></div>
</div>

<script>
// 🔐 设置你的密码（自己改）
const PASSWORD = "123456";

// 登录功能
function login(){
  const input = document.getElementById("password").value;

  if(input === PASSWORD){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("app").style.display="block";
    loadOrders(); // 登录后才加载数据
  }else{
    document.getElementById("error").innerText="Wrong password!";
  }
}

// 🔥 Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 📊 读取订单
function loadOrders(){
  db.ref('orders').on('value', snap=>{
    const ordersDiv = document.getElementById('orders');
    ordersDiv.innerHTML="";

    let totalAll=0;
    const data=snap.val()||{};

    for(let id in data){
      const o=data[id];

      let total=0;
      let itemsText="";

      if(o.items && Array.isArray(o.items)){
        o.items.forEach(i=>{
          if(typeof i === "string"){
            itemsText += i + "<br>";
          }else{
            itemsText += i.name + " ($" + i.price + ")<br>";
            total += parseFloat(i.price || 0);
          }
        });
      }

      totalAll += total;

      const div=document.createElement('div');
      div.className="order";
      div.innerHTML=`
        <b>Table ${o.table}</b><br>
        ${itemsText}
        💰 $${total.toFixed(2)}<br>
        🕒 ${o.time || ''}
      `;

      ordersDiv.appendChild(div);
    }

    document.getElementById('total').innerHTML =
      "Total Sales: $" + totalAll.toFixed(2);
  });
}
</script>

</body>
</html>
