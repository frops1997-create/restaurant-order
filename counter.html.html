<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter System</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  padding: 20px;
}

h1 {
  text-align: center;
}

.order {
  background: white;
  border: 1px solid #ccc;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 10px;
}

.totalBox {
  background: black;
  color: white;
  padding: 20px;
  font-size: 24px;
  text-align: center;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>💰 Counter Orders</h1>

<div id="orders"></div>

<div class="totalBox" id="totalSales">
  Total Sales: $0
</div>

<script>

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function loadOrders() {
  const ordersDiv = document.getElementById('orders');
  const totalDiv = document.getElementById('totalSales');

  db.ref('orders').on('value', snap => {
    ordersDiv.innerHTML = '';

    let totalAll = 0;
    const data = snap.val() || {};

    for (let id in data) {
      const o = data[id];

      let total = 0;

      if (o.items) {
        o.items.forEach(item => {
          total += parseFloat(item.price || 0);
        });
      }

      totalAll += total;

      const div = document.createElement('div');
      div.className = 'order';

      div.innerHTML = `
        <b>Table ${o.table}</b><br>
        💰 Order Total: $${total.toFixed(2)}<br>
        🕒 ${o.time || ''}
      `;

      ordersDiv.appendChild(div);
    }

    totalDiv.innerHTML = `Total Sales: $${totalAll.toFixed(2)}`;
  });
}

loadOrders();

</script>

</body>
</html>
