<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Ordering System</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
body { font-family: Arial; display: flex; flex-wrap: wrap; }
.container { width: 50%; padding: 20px; }
.order { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
</style>
</head>

<body>

<!-- Customer -->
<div class="container">
  <h2>Order</h2>
  <p>Table: <span id="tableNo"></span></p>

  <input type="text" id="customerName" placeholder="Your Name"><br><br>

  <label><input type="checkbox" value="Fried Rice" data-price="8" onchange="updateTotal()"> Fried Rice - $8</label><br>
  <label><input type="checkbox" value="Beef Noodles" data-price="10" onchange="updateTotal()"> Beef Noodles - $10</label><br>
  <label><input type="checkbox" value="BBQ Pork" data-price="12" onchange="updateTotal()"> BBQ Pork - $12</label><br>

  <br>
  <button onclick="submitOrder()">Submit</button>
  <p id="orderTotal">Total: $0</p>
</div>

<!-- Kitchen -->
<div class="container">
  <h2>Kitchen Orders</h2>
  <div id="orders"></div>
  <h3 id="totalSales"></h3>
</div>

<script>

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Table
const params = new URLSearchParams(window.location.search);
let table = params.get('table') || Math.floor(Math.random()*20+1);
document.getElementById('tableNo').innerText = table;

// 💰 更新价格
function updateTotal(){
  let total = 0;
  document.querySelectorAll('input:checked').forEach(i=>{
    total += parseFloat(i.dataset.price);
  });
  document.getElementById('orderTotal').innerText = "Total: $" + total.toFixed(2);
}

// 📦 下单
function submitOrder(){
  const name = document.getElementById('customerName').value;
  const items = document.querySelectorAll('input:checked');

  if(!name || items.length===0){
    alert("Enter name & select food");
    return;
  }

  let list = [];
  let total = 0;

  items.forEach(i=>{
    const price = parseFloat(i.dataset.price);
    list.push({name:i.value, price:price});
    total += price;
  });

  db.ref('orders').push({
    table,
    name,
    items:list,
    total,
    time:new Date().toLocaleTimeString()
  });

  alert("Order sent!");
  location.reload();
}

// 🍳 厨房显示（修复重点）
function loadOrders(){
  const ordersDiv = document.getElementById('orders');
  const totalSalesDiv = document.getElementById('totalSales');

  db.ref('orders').on('value', snap=>{
    ordersDiv.innerHTML='';
    let totalSales = 0;

    const data = snap.val()||{};

    for(let id in data){
      const o = data[id];

      // ✅ 关键修复：正确显示 items
      let itemsText = "";
      if(o.items && Array.isArray(o.items)){
        o.items.forEach(item=>{
          itemsText += `${item.name} ($${item.price})<br>`;
        });
      }

      const div = document.createElement('div');
      div.className='order';

      div.innerHTML = `
        <b>Table ${o.table}</b><br>
        👤 ${o.name}<br>
        ${itemsText}
        💰 Total: $${o.total}<br>
        🕒 ${o.time}<br>
        <button onclick="completeOrder('${id}')">Done</button>
      `;

      ordersDiv.appendChild(div);
      totalSales += o.total;
    }

    totalSalesDiv.innerText = "Total Sales: $" + totalSales.toFixed(2);
  });
}

// ❌ 完成订单
function completeOrder(id){
  db.ref('orders/'+id).remove();
}

loadOrders();

</script>

</body>
</html>
