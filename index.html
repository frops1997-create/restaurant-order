<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Food Order</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    background: #f5f5f5;
  }

  /* 点餐区域：背景图 + 内层半透明 */
  #customer {
    flex: 1;
    min-width: 350px;
    padding: 30px;
    border-radius: 12px;

    /* 背景图在这里 */
    background-image: url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c');
    background-size: cover;
    background-position: center;

    position: relative;
    overflow: hidden;
  }

  /* 半透明内层 */
  #customer .inner {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255, 0.85);
    padding: 25px;
    border-radius: 10px;
    font-weight: bold;
  }

  .other {
    min-width: 300px;
    padding: 20px;
    background: white;
    border-radius: 12px;
  }

  .order {
    border: 1px solid #ccc;
    padding: 10px;
    margin: 10px 0;
    background: #fff;
  }

  label {
    display: block;
    margin: 8px 0;
  }

  button {
    padding: 10px;
    width: 100%;
    margin-top: 10px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
  }
</style>
</head>

<body>

<!-- 顾客端（有背景 + 半透明） -->
<div id="customer">
  <div class="inner">
    <h2>Scan & Order</h2>
    <p>Table: <span id="tableNo"></span></p>

    <h3>Menu</h3>
    <label><input type="checkbox" data-price="8" onchange="updateTotal()"> Fried Rice - $8</label>
    <label><input type="checkbox" data-price="10" onchange="updateTotal()"> Beef Noodles - $10</label>
    <label><input type="checkbox" data-price="12" onchange="updateTotal()"> BBQ Pork - $12</label>
    <label><input type="checkbox" data-price="15" onchange="updateTotal()"> BBQ Chicken - $15</label>
    <label><input type="checkbox" data-price="18" onchange="updateTotal()"> BBQ Salmon - $18</label>
    <label><input type="checkbox" data-price="13" onchange="updateTotal()"> Nasi Lemak Curry - $13</label>
    <label><input type="checkbox" data-price="12" onchange="updateTotal()"> Nasi Lemak Chicken - $12</label>
    <label><input type="checkbox" data-price="9" onchange="updateTotal()"> Nasi Lemak Egg - $9</label>

    <button onclick="submitOrder()">Submit Order</button>
    <p id="total">Total: $0.00</p>
  </div>
</div>

<!-- 厨房 -->
<div class="other" id="kitchenSection">
  <h2>Kitchen Orders</h2>
  <div id="orders"></div>
</div>

<!-- QR -->
<div class="other" id="qrSection">
  <h2>Table QR</h2>
  <input type="number" id="tableInput" placeholder="Table No" style="width:100%; padding:10px; margin-bottom:10px;">
  <button onclick="generateQR()">Generate QR</button>
  <div id="qrcode" style="margin-top:20px;"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs",
  storageBucket: "restaurants-cs.firebasestorage.app",
  messagingSenderId: "209872919844",
  appId: "1:209872919844:web:c1730801cd51d615e867b1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(location.search);
let table = params.get('table') || Math.floor(Math.random()*20)+1;
const isKitchen = params.get('kitchen');
const isAdmin = params.get('admin');

!isKitchen && (document.getElementById('kitchenSection').style.display='none');
!isAdmin && (document.getElementById('qrSection').style.display='none');
document.getElementById('tableNo').textContent = table;

function updateTotal() {
  let total = 0;
  document.querySelectorAll('input:checked').forEach(i => total += parseFloat(i.dataset.price));
  document.getElementById('total').innerText = `Total: $${total.toFixed(2)}`;
}

function submitOrder() {
  const items = Array.from(document.querySelectorAll('input:checked'));
  if (items.length === 0) { alert('Select food!'); return; }

  let total = 0;
  let list = [];
  items.forEach(i => {
    total += parseFloat(i.dataset.price);
    list.push(i.nextSibling.textContent.trim());
  });

  db.ref('orders').push({
    table: table,
    items: list,
    time: new Date().toLocaleTimeString()
  });

  alert(`Order Success!\nTable: ${table}\nTotal: $${total.toFixed(2)}`);
  location.reload();
}

function loadOrders() {
  db.ref('orders').on('value', snap => {
    const data = snap.val();
    const out = document.getElementById('orders');
    out.innerHTML = '';

    if (!data) { out.innerHTML = '<p>No orders</p>'; return; }

    for (let id in data) {
      const o = data[id];
      const div = document.createElement('div');
      div.className = 'order';
      div.innerHTML = `<b>Table ${o.table}</b><br>${o.items.join(', ')}<br>${o.time}<br>
      <button onclick="completeOrder('${id}')">Done</button>`;
      out.appendChild(div);
    }
  });
}

function completeOrder(id) {
  db.ref('orders/'+id).remove();
}

function generateQR() {
  const t = document.getElementById('tableInput').value;
  if (!t) { alert('Enter table!'); return; }
  QRCode.toCanvas(document.getElementById('qrcode'), `${location.origin}${location.pathname}?table=${t}`, {width:180});
}

loadOrders();
</script>

</body>
</html>
