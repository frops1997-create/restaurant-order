<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Food Order</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f5f5f5;
}

.menu-box {
  max-width: 400px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

.order {
  border: 1px solid #ccc;
  padding: 10px;
  margin: 10px;
  background: white;
}
</style>
</head>

<body>

<div class="menu-box">
  <h2>Scan & Order</h2>
  <p>Table: <span id="tableNo"></span></p>

  <label><input type="checkbox" data-price="8" onchange="updateTotal()"> Fried Rice - $8</label>
  <label><input type="checkbox" data-price="10" onchange="updateTotal()"> Beef Noodles - $10</label>
  <label><input type="checkbox" data-price="12" onchange="updateTotal()"> BBQ Pork - $12</label>
  <label><input type="checkbox" data-price="15" onchange="updateTotal()"> BBQ Chicken - $15</label>

  <button id="submitBtn" onclick="submitOrder()">Submit</button>
  <p id="total">Total: $0.00</p>

  <div id="orderConfirm" style="display:none;color:green;">
    Order Sent! Total: $<span id="showTotal"></span>
  </div>
</div>

<hr>

<div id="kitchenSection">
  <h2>Kitchen Orders</h2>
  <div id="orders"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(location.search);
let table = params.get('table') || Math.floor(Math.random()*20)+1;
const isKitchen = params.get('kitchen');

document.getElementById('tableNo').innerText = table;

// ✅ 计算总价
function updateTotal() {
  let total = 0;
  document.querySelectorAll('input:checked').forEach(i => {
    total += parseFloat(i.dataset.price);
  });
  document.getElementById('total').innerText = `Total: $${total.toFixed(2)}`;
}

// ✅ 提交订单（含 total）
function submitOrder() {
  const items = Array.from(document.querySelectorAll('input:checked'));
  if (items.length === 0) {
    alert('Select food!');
    return;
  }

  let total = 0;
  let list = [];

  items.forEach(i => {
    total += parseFloat(i.dataset.price);
    list.push(i.parentElement.textContent.trim());
  });

  db.ref('orders').push({
    table: table,
    items: list,
    total: total, // ✅ 存 total
    time: new Date().toLocaleTimeString()
  });

  document.getElementById('showTotal').innerText = total.toFixed(2);
  document.getElementById('orderConfirm').style.display = 'block';
}

// ✅ 厨房显示订单（含 total）
function loadOrders() {
  if (!isKitchen) return;

  db.ref('orders').on('value', snap => {
    const data = snap.val();
    const out = document.getElementById('orders');
    out.innerHTML = '';

    if (!data) {
      out.innerHTML = 'No orders';
      return;
    }

    for (let id in data) {
      const o = data[id];

      const div = document.createElement('div');
      div.className = 'order';

      div.innerHTML = `
        <b>Table ${o.table}</b><br>
        ${o.items.join(', ')}<br>
        💰 Total: $${o.total ? o.total.toFixed(2) : '0.00'}<br>
        ⏰ ${o.time}<br>
        <button onclick="completeOrder('${id}')">Done</button>
      `;

      out.appendChild(div);
    }
  });
}

// ✅ 完成订单
function completeOrder(id) {
  db.ref('orders/' + id).remove();
}

loadOrders();
</script>

</body>
</html>
