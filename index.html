<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Food Order - Kitchen System</title>

<!-- Firebase SDKs -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script src="https://jsdelivr.net"></script>

<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background-image: url('https://unsplash.com');
    background-size: 75%;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #f8f9fa;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .menu-box, #kitchenSection, #qrSection {
    width: 100%;
    max-width: 400px;
    padding: 30px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 16px;
    font-weight: bold;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  .order-confirm {
    background: rgba(0, 150, 0, 0.8);
    color: white;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    text-align: center;
    display: none;
  }

  label { display: block; margin: 8px 0; cursor: pointer; }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  button:disabled { background: #cccccc; cursor: not-allowed; }
  .btn-done { background: #28a745; margin-top: 10px; }

  .order-card {
    border-left: 5px solid #007bff;
    padding: 15px;
    margin: 15px 0;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .total-price {
    color: #d9534f;
    font-size: 1.1em;
    margin-top: 5px;
    display: block;
  }
</style>
</head>

<body>

<!-- Customer Menu Section -->
<div id="customerSection" class="menu-box">
  <h2>Scan & Order</h2>
  <p>Table: <span id="tableNo"></span></p>

  <h3>Menu</h3>
  <div id="menuItems">
    <label><input type="checkbox" data-price="8" onchange="updateTotal()"> Fried Rice - $8</label>
    <label><input type="checkbox" data-price="10" onchange="updateTotal()"> Beef Noodles - $10</label>
    <label><input type="checkbox" data-price="12" onchange="updateTotal()"> BBQ Pork - $12</label>
    <label><input type="checkbox" data-price="15" onchange="updateTotal()"> BBQ Chicken - $15</label>
    <label><input type="checkbox" data-price="18" onchange="updateTotal()"> BBQ Salmon - $18</label>
    <label><input type="checkbox" data-price="13" onchange="updateTotal()"> Nasi Lemak Curry - $13</label>
    <label><input type="checkbox" data-price="12" onchange="updateTotal()"> Nasi Lemak Chicken - $12</label>
    <label><input type="checkbox" data-price="9" onchange="updateTotal()"> Nasi Lemak Egg - $9</label>
  </div>

  <button id="submitBtn" onclick="submitOrder()">Submit Order</button>
  <p id="totalDisplay">Total: $0.00</p>

  <div class="order-confirm" id="orderConfirm">
    <h3>Order Submitted!</h3>
    <p>Table: <span id="showTable"></span></p>
    <p>Total: $<span id="showTotal"></span></p>
    <small>Please wait for your food</small>
  </div>
</div>

<!-- Kitchen Display Section -->
<div id="kitchenSection" style="display:none;">
  <h2>Kitchen Orders</h2>
  <div id="orders">Loading...</div>
</div>

<!-- Admin QR Generator Section -->
<div id="qrSection" style="display:none;">
  <h2>Table QR Generator</h2>
  <input type="number" id="tableInput" placeholder="Enter Table No" style="width:100%; padding:10px; margin-bottom:10px;">
  <button onclick="generateQR()">Generate QR Code</button>
  <div id="qrcode" style="margin-top:20px; display:flex; justify-content:center;"></div>
</div>

<script>
// --- Configuration ---
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "://firebaseapp.com",
  databaseURL: "https://firebasedatabase.app",
  projectId: "restaurants-cs",
  storageBucket: "restaurants-cs.firebasestorage.app",
  messagingSenderId: "209872919844",
  appId: "1:209872919844:web:c1730801cd51d615e867b1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// --- Initialization ---
const params = new URLSearchParams(location.search);
const table = params.get('table') || "Guest";
const isKitchen = params.get('kitchen') === 'true';
const isAdmin = params.get('admin') === 'true';

document.getElementById('tableNo').textContent = table;

// Route View Logic
if (isKitchen) {
  document.getElementById('customerSection').style.display = 'none';
  document.getElementById('kitchenSection').style.display = 'block';
  loadOrders();
}
if (isAdmin) {
  document.getElementById('qrSection').style.display = 'block';
}

// --- Customer Functions ---
function updateTotal() {
  let total = 0;
  document.querySelectorAll('#menuItems input:checked').forEach(i => {
    total += parseFloat(i.dataset.price);
  });
  document.getElementById('totalDisplay').innerText = `Total: $${total.toFixed(2)}`;
}

function submitOrder() {
  const btn = document.getElementById('submitBtn');
  const items = Array.from(document.querySelectorAll('#menuItems input:checked'));

  if (items.length === 0) {
    alert('Please select at least one item!');
    return;
  }

  btn.disabled = true;
  btn.innerText = "Sending...";

  let totalAmount = 0;
  let itemList = [];
  
  items.forEach(i => {
    totalAmount += parseFloat(i.dataset.price);
    itemList.push(i.parentElement.textContent.split('-')[0].trim());
  });

  // Save to Firebase including the TOTAL
  db.ref('orders').push({
    table: table,
    items: itemList,
    total: totalAmount.toFixed(2), // NEW: Storing total in DB
    time: new Date().toLocaleTimeString()
  }).then(() => {
    document.getElementById('showTable').innerText = table;
    document.getElementById('showTotal').innerText = totalAmount.toFixed(2);
    document.getElementById('orderConfirm').style.display = 'block';
    btn.innerText = "Order Sent!";
  });
}

// --- Kitchen Functions ---
function loadOrders() {
  db.ref('orders').on('value', snap => {
    const data = snap.val();
    const out = document.getElementById('orders');
    out.innerHTML = '';
    
    if (!data) {
      out.innerHTML = '<p>No pending orders.</p>';
      return;
    }

    for (let id in data) {
      const o = data[id];
      const div = document.createElement('div');
      div.className = 'order-card';
      
      // Updated UI to show the TOTAL amount in the Kitchen view
      div.innerHTML = `
        <strong>Table: ${o.table}</strong><br>
        <small>${o.time}</small><hr>
        <div>${o.items.join('<br>')}</div>
        <div class="total-price"><strong>Total Bill: $${o.total || '0.00'}</strong></div>
        <button class="btn-done" onclick="completeOrder('${id}')">Mark as Done</button>
      `;
      out.appendChild(div);
    }
  });
}

function completeOrder(id) {
  db.ref('orders/' + id).remove();
}

// --- Admin Functions ---
function generateQR() {
  const t = document.getElementById('tableInput').value;
  if (!t) { alert('Please enter a table number'); return; }
  
  const url = `${window.location.origin}${window.location.pathname}?table=${t}`;
  const qrContainer = document.getElementById('qrcode');
  qrContainer.innerHTML = ''; // Clear previous
  
  QRCode.toCanvas(url, { width: 200 }, function (error, canvas) {
    if (error) console.error(error);
    qrContainer.appendChild(canvas);
  });
}
</script>

</body>
</html>
