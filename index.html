<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Food Ordering System</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<!-- QR Code Generator -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body { font-family: Arial; display: flex; flex-wrap: wrap; }
.container { width: 50%; padding: 20px; }
.order { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
.qr-box { margin-top: 20px; }
</style>
</head>
<body>

<!-- Customer Side -->
<div class="container">
  <h2>Scan & Order</h2>
  <p>Table: <span id="tableNo"></span></p>

  <input type="text" id="customerName" placeholder="Your Name"><br><br>

  <h8>Menu</h8><br>
  <label><input type="checkbox" value="Fried Rice" data-price="8.00"> Fried Rice - $8.00</label><br>
  <label><input type="checkbox" value="Beef Noodles" data-price="10.00"> Beef Noodles - $10.00</label><br>
  <label><input type="checkbox" value="BBQ Pork" data-price="12.00"> BBQ Pork - $12.00</label><br>
  <label><input type="checkbox" value="BBQ Chicken" data-price="15.00"> BBQ Chicken - $15.00</label><br>
  <label><input type="checkbox" value="BBQ Salmon" data-price="18.00"> BBQ Salmon - $18.00</label><br>
  <label><input type="checkbox" value="Nasi Lemak Curry Chicken" data-price="13.00"> Nasi Lemak Curry Chicken - $13.00</label><br>
  <label><input type="checkbox" value="Nasi Lemak Fried Chicken" data-price="12.00"> Nasi Lemak Fried Chicken - $12.00</label><br>
  <label><input type="checkbox" value="Nasi Lemak Fried Egg" data-price="9.00"> Nasi Lemak Fried Egg - $9.00</label><br>

  <button onclick="submitOrder()">Submit Order</button>
  <div id="orderTotal"></div>
</div>

<!-- Kitchen Side -->
<div class="container">
  <h2>Kitchen Orders</h2>
  <div id="orders"></div>
  <div id="totalSales"></div>
</div>

<!-- QR Generator (for owner) -->
<div class="container">
  <h2>Generate Table QR Code</h2>
  <input type="number" id="tableInput" placeholder="Table Number">
  <button onclick="generateQR()">Generate QR</button>
  <div id="qrcode" class="qr-box"></div>
</div>

<script>
// 🔥 Replace with your Firebase config
const firebaseConfig = {
  apiKey: "真实的key",
  authDomain: "你的项目.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "你的项目ID",
  storageBucket: "你的项目.appspot.com",
  messagingSenderId: "真实ID",
  appId: "真实ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 📌 Get table number from URL
const params = new URLSearchParams(window.location.search);
let table = params.get('table');

// 如果没有 table 参数 → 随机生成 1~20 桌
if (!table) {
  table = Math.floor(Math.random() * 20) + 1;
}

// 显示桌号
document.getElementById('tableNo').innerText = table;

function submitOrder() {
  const name = document.getElementById('customerName').value;
  const items = document.querySelectorAll('input[type=checkbox]:checked');

  if (!name || items.length === 0) {
    alert('Enter name & select food');
    return;
  }

  let orderItems = [];
  let totalPrice = 0;
  items.forEach(item => {
    const itemName = item.value;
    const itemPrice = parseFloat(item.getAttribute('data-price'));
    orderItems.push({ name: itemName, price: itemPrice });
    totalPrice += itemPrice;
  });

  db.ref('orders').push({
    table: table,
    name: name,
    items: orderItems,
    totalPrice: totalPrice, // Store the total price
    status: 'New',
    time: new Date().toLocaleTimeString()
  });

  alert('Order sent!');
  // Optionally, clear checkboxes and name after submission
  document.getElementById('customerName').value = '';
  items.forEach(item => item.checked = false);
  document.getElementById('orderTotal').innerText = ''; // Clear displayed total
}

function loadOrders() {
  const ordersDiv = document.getElementById('orders');
  const totalSalesDiv = document.getElementById('totalSales');
  let overallTotalPrice = 0;

  db.ref('orders').on('value', snapshot => {
    ordersDiv.innerHTML = '';
    const data = snapshot.val();

    if (data) {
      for (let id in data) {
        const order = data[id];
        const div = document.createElement('div');
        div.className = 'order';

        let itemsHtml = order.items.map(item => `${item.name} - $${item.price.toFixed(2)}`).join('<br>');

        div.innerHTML = `<b>Table ${order.table}</b><br>${order.name}<br>${itemsHtml}<br>
        <b>Total: $${order.totalPrice.toFixed(2)}</b><br>${order.time}<br>
        <button onclick="completeOrder('${id}')">Done</button>`;
        ordersDiv.appendChild(div);

        overallTotalPrice += order.totalPrice; // Add to overall total
      }
    }

    totalSalesDiv.innerHTML = `<h3>Total Sales: $${overallTotalPrice.toFixed(2)}</h3>`;
  });
}

// 📱 Generate QR Code
function generateQR() {
  const tableNo = document.getElementById('tableInput').value;
  const url = window.location.origin + window.location.pathname + '?table=' + tableNo;

  const qrDiv = document.getElementById('qrcode');
  qrDiv.innerHTML = '';

  });
}

loadOrders();
</script>

</body>
</html>
