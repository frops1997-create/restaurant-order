<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Food Order</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    
    /* 背景：完美居中 + 固定显示 */
    background-image: url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c');
    background-size: 50%;
    background-position: center center; /* 绝对居中 */
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #f8f9fa;
    
    display: flex;
    justify-content: center; /* 水平居中 */
    align-items: center;     /* 垂直居中 */
  }

  /* 菜单盒子居中显示 */
  .menu-box {
    width: 380px;
    padding: 30px;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 16px;
    font-weight: bold;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  }

  .order-confirm {
    background: rgba(0, 150, 0, 0.8);
    color: white;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    font-size: 16px;
    text-align: center;
    display: none;
  }

  label {
    display: block;
    margin: 8px 0;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  button:disabled {
    background: #cccccc;
    cursor: not-allowed;
  }

  button:hover:not(:disabled) {
    background: #0056b3;
  }

  #kitchenSection, #qrSection {
    display: none;
  }

  .order {
    border: 1px solid #ccc;
    padding: 10px;
    margin: 10px 0;
    background: white;
  }
</style>
</head>

<body>

<div class="menu-box">
  <h2>Scan & Order</h2>
  <p>Table: <span id="tableNo"></span></p>

  <h3>Menu</h3>
  <label><input type="checkbox" data-price="8" onchange="updateTotal()">1 Fried Rice - $8</label>
  <label><input type="checkbox" data-price="10" onchange="updateTotal()"> Beef Noodles - $10</label>
  <label><input type="checkbox" data-price="12" onchange="updateTotal()"> BBQ Pork - $12</label>
  <label><input type="checkbox" data-price="15" onchange="updateTotal()"> BBQ Chicken - $15</label>
  <label><input type="checkbox" data-price="18" onchange="updateTotal()"> BBQ Salmon - $18</label>
  <label><input type="checkbox" data-price="13" onchange="updateTotal()"> Nasi Lemak Curry - $13</label>
  <label><input type="checkbox" data-price="12" onchange="updateTotal()"> Nasi Lemak Chicken - $12</label>
  <label><input type="checkbox" data-price="9" onchange="updateTotal()"> Nasi Lemak Egg - $9</label>

  <button id="submitBtn" onclick="submitOrder()">Submit Order</button>
  <p id="total">Total: $0.00</p>

  <div class="order-confirm" id="orderConfirm">
    <h3>Order Submitted!</h3>
    <p>Table: <span id="showTable"></span></p>
    <p>Total: $<span id="showTotal"></span></p>
    <small>Please wait for your food</small>
  </div>
</div>

<div id="kitchenSection">
  <h2>Kitchen Orders</h2>
  <div id="orders"></div>
</div>

<div id="qrSection">
  <h2>Table QR</h2>
  <input type="number" id="tableInput" placeholder="Table No">
  <button onclick="generateQR()">Generate QR</button>
  <div id="qrcode"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs",
  storageBucket: "restaurants-cs.firebasestorage.app",
  messagingSenderId: "209872919844",
  appId: "1:209872919844:web:c1730801cd51d615e867b1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(location.search);
let table = params.get('table') || Math.floor(Math.random()*20)+1;
const isKitchen = params.get('kitchen');
const isAdmin = params.get('admin');

if (!isKitchen) document.getElementById('kitchenSection').style.display = 'none';
if (!isAdmin) document.getElementById('qrSection').style.display = 'none';
document.getElementById('tableNo').textContent = table;

function updateTotal() {
  let total = 0;
  document.querySelectorAll('input:checked').forEach(i => total += parseFloat(i.dataset.price));
  document.getElementById('total').innerText = `Total: $${total.toFixed(2)}`;
}

// 只能提交一次，防止重复下单
function submitOrder() {
  const btn = document.getElementById('submitBtn');
  if (btn.disabled) return;

  const items = Array.from(document.querySelectorAll('input:checked'));
  if (items.length === 0) {
    alert('Please select food!');
    return;
  }

  btn.disabled = true;
  btn.innerText = "Order Sent";

 let total = 0;
  let list = [];
  items.forEach(i => {
    total += parseFloat(i.dataset.price);
    list.push(i.nextSibling.textContent.trim());
  });

  db.ref('orders').push({
    table: table,
    items: list,
    time: new Date().toLocaleTimeString()
  });

  document.getElementById('showTable').innerText = table;
  document.getElementById('showTotal').innerText = total.toFixed(2);
  document.getElementById('orderConfirm').style.display = 'block';
}

function loadOrders() {
  db.ref('orders').on('value', snap => {
    const data = snap.val();
    const out = document.getElementById('orders');
    out.innerHTML = '';
    if (!data) { out.innerHTML = '<p>No orders</p>'; return; }

    for (let id in data) {
      const o = data[id];
      const div = document.createElement('div');
      div.className = 'order';
      div.innerHTML = `<b>Table ${o.table}</b><br>${o.items.join(', ')}<br>${o.time}<br>
      <button onclick="completeOrder('${id}')">Done</button>`;
      out.appendChild(div);
    }
  });
}

function completeOrder(id) {
  db.ref('orders/'+id).remove();
}

function generateQR() {
  const t = document.getElementById('tableInput').value;
  if (!t) { alert('Enter table!'); return; }
  QRCode.toCanvas(document.getElementById('qrcode'), `${location.origin}${location.pathname}?table=${t}`, {width:180});
}

loadOrders();
</script>

</body>
</html>
