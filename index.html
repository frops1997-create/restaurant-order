<script>
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs",
  storageBucket: "restaurants-cs.firebasestorage.app",
  messagingSenderId: "209872919844",
  appId: "1:209872919844:web:c1730801cd51d615e867b1",
  measurementId: "G-12T3WGM880"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 📌 Get table number
const params = new URLSearchParams(window.location.search);
let table = params.get('table');

// 没有桌号 → 随机
if (!table) {
  table = Math.floor(Math.random() * 20) + 1;
}

document.getElementById('tableNo').innerText = table;

function submitOrder() {
  const name = document.getElementById('customerName').value;
  const items = document.querySelectorAll('input[type=checkbox]:checked');

  if (!name || items.length === 0) {
    alert('Enter name & select food');
    return;
  }

  let orderItems = [];
  items.forEach(item => orderItems.push(item.value));

  db.ref('orders').push({
    table: table,
    name: name,
    items: orderItems,
    status: 'New',
    time: new Date().toLocaleTimeString()
  });

  alert('Order sent!');
  location.reload();
}

function loadOrders() {
  const ordersDiv = document.getElementById('orders');

  db.ref('orders').on('value', snapshot => {
    ordersDiv.innerHTML = '';
    const data = snapshot.val() || {};

    for (let id in data) {
      const order = data[id];
      const div = document.createElement('div');
      div.className = 'order';
      div.innerHTML = `
        <b>Table ${order.table}</b><br>
        ${order.name}<br>
        ${order.items.join(', ')}<br>
        ${order.time}<br>
        <button onclick="completeOrder('${id}')">Done</button>
      `;
      ordersDiv.appendChild(div);
    }
  });
}

function completeOrder(id) {
  db.ref('orders/' + id).remove();
}

function generateQR() {
  const tableNo = document.getElementById('tableInput').value;
  const url = window.location.origin + window.location.pathname + '?table=' + tableNo;

  const qrDiv = document.getElementById('qrcode');
  qrDiv.innerHTML = '';

  QRCode.toCanvas(url, function (err, canvas) {
    if (err) console.error(err);
    qrDiv.appendChild(canvas);
  });
}

loadOrders();
</script>
