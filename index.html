<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Food Ordering System</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<!-- QR Code Generator -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body {
  font-family: Arial;
  display: flex;
  flex-wrap: wrap;
  background-image: url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");
  background-size: cover;
  background-position: center;
}
.container { 
  width: 50%; 
  padding: 20px; 
  background: rgba(255,255,255,0.9);
  border-radius: 10px;
}
.order { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
.qr-box { margin-top: 20px; }
</style>
</head>
<body>

<!-- Customer Side -->
<div class="container">
  <h2>Scan & Order</h2>
  <p>Table: <span id="tableNo"></span></p>

  <h8>Menu</h8><br>
  <label><input type="checkbox" value="（1） Fried Rice" data-price="8.00" onchange="updateOrderTotal()"> (1) Fried Rice - $8.00</label><br>
  <label><input type="checkbox" value="（2） Beef Noodles" data-price="10.00" onchange="updateOrderTotal()"> (2) Beef Noodles - $10.00</label><br>
  <label><input type="checkbox" value="（3） BBQ Pork" data-price="12.00" onchange="updateOrderTotal()"> (3) BBQ Pork - $12.00</label><br>
  <label><input type="checkbox" value="（4） BBQ Chicken" data-price="15.00" onchange="updateOrderTotal()"> (4) BBQ Chicken - $15.00</label><br>
  <label><input type="checkbox" value="（5） BBQ Salmon" data-price="18.00" onchange="updateOrderTotal()"> (5) BBQ Salmon - $18.00</label><br>
  <label><input type="checkbox" value="（6） Nasi Lemak Curry Chicken" data-price="13.00" onchange="updateOrderTotal()"> (6) Nasi Lemak Curry Chicken - $13.00</label><br>
  <label><input type="checkbox" value="（7） Nasi Lemak Fried Chicken" data-price="12.00" onchange="updateOrderTotal()"> (7) Nasi Lemak Fried Chicken - $12.00</label><br>
  <label><input type="checkbox" value="（8） Nasi Lemak Fried Egg" data-price="9.00" onchange="updateOrderTotal()"> (8) Nasi Lemak Fried Egg - $9.00</label><br>

  <button onclick="submitOrder()">Submit Order</button>
  <p id="orderTotal">Total: $0</p>
</div>

<!-- Kitchen Side -->
<div class="container" id="kitchenSection">
  <h2>Kitchen Orders</h2>
  <div id="orders"></div>
</div>

<!-- QR Generator (for owner) -->
<div class="container" id="qrSection">
  <h2>Generate Table QR Code</h2>
  <input type="number" id="tableInput" placeholder="Table Number">
  <button onclick="generateQR()">Generate QR</button>
  <div id="qrcode" class="qr-box"></div>
</div>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs",
  storageBucket: "restaurants-cs.firebasestorage.app",
  messagingSenderId: "209872919844",
  appId: "1:209872919844:web:c1730801cd51d615e867b1",
  measurementId: "G-12T3WGM880"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Get table number from URL
const params = new URLSearchParams(window.location.search);
let table = params.get('table');
const isKitchen = params.get('kitchen');
const isAdmin = params.get('admin');
if (!isKitchen) {
  document.getElementById('kitchenSection').style.display = 'none';
}
if (!isAdmin) {
  document.getElementById('qrSection').style.display = 'none';
}

// Auto generate table 1-20
if (!table) {
  table = Math.floor(Math.random() * 20) + 1;
}

// Show table number
document.getElementById('tableNo').innerText = table;

// Update order total
function updateOrderTotal() {
  const items = document.querySelectorAll('input[type=checkbox]:checked');
  let totalPrice = 0;
  items.forEach(item => {
    totalPrice += parseFloat(item.getAttribute('data-price'));
  });
  document.getElementById('orderTotal').innerText = 'Current Order Total: $' + totalPrice.toFixed(2);
}

// Submit order (NO NAME REQUIRED)
function submitOrder() {
  const items = document.querySelectorAll('input[type=checkbox]:checked');

  if (items.length === 0) {
    alert('Please select food');
    return;
  }

  let orderItems = [];
  items.forEach(item => orderItems.push(item.value));

  db.ref('orders').push({
    table: table,
    items: orderItems,
    status: 'New',
    time: new Date().toLocaleTimeString()
  });

  alert('Order sent!');
  location.reload();
}

// Load orders for kitchen (NO NAME DISPLAYED)
function loadOrders() {
  const ordersDiv = document.getElementById('orders');

  db.ref('orders').on('value', snapshot => {
    ordersDiv.innerHTML = '';
    const data = snapshot.val();

    for (let id in data) {
      const order = data[id];
      const div = document.createElement('div');
      div.className = 'order';
      div.innerHTML = `<b>Table ${order.table}</b><br>${order.items.join(', ')}<br>${order.time}<br>
      <button onclick="completeOrder('${id}')">Done</button>`;
      ordersDiv.appendChild(div);
    }
  });
}

// Complete order
function completeOrder(id) {
  db.ref('orders/' + id).remove();
}

// Generate QR code
function generateQR() {
  const tableNum = document.getElementById('tableInput').value;
  if (!tableNum) return;
  const url = window.location.origin + window.location.pathname + '?table=' + tableNum;
  QRCode.toCanvas(document.getElementById('qrcode'), url, { width: 200 });
}

loadOrders();
</script>

</body>
</html>
