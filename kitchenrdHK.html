<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>厨房显示系统 | 仅显示含"Hong Kong Roast"餐品订单</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', 'Roboto', system-ui, Arial, sans-serif;
    background: #0a0c0e;
    color: #f0f3f8;
  }

  h1 {
    text-align: center;
    padding: 16px 0 8px;
    margin: 0;
    font-size: 1.8rem;
    font-weight: 600;
    background: linear-gradient(135deg, #e0eaff 0%, #ffd966 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }

  .filter-badge {
    text-align: center;
    font-size: 0.85rem;
    background: #1f2a1f;
    display: inline-block;
    width: auto;
    margin: 4px auto 8px;
    padding: 5px 18px;
    border-radius: 40px;
    color: #ffd966;
    letter-spacing: 0.5px;
    font-weight: 600;
    box-shadow: inset 0 0 4px #2a5f2a, 0 2px 6px rgba(0,0,0,0.3);
  }

  .filter-badge strong {
    color: #ffaa33;
    font-size: 1rem;
  }

  .header-area {
    text-align: center;
    position: relative;
  }

  .board {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 110px);
    overflow: hidden;
  }

  .column {
    background: #14181c;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    border: 1px solid #2b2f33;
  }

  .column h2 {
    text-align: center;
    margin: 0;
    padding: 16px 0;
    font-size: 1.4rem;
    font-weight: 600;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    border-bottom: 2px solid #3a3f44;
    letter-spacing: 1px;
  }

  .new h2 { background: #5a2e2e; color: #ffc9c9; border-bottom-color: #b54c4c; }
  .preparing h2 { background: #5e4a1f; color: #ffe1a3; border-bottom-color: #d9a13b; }
  .ready h2 { background: #1a4d2a; color: #c8ffcf; border-bottom-color: #44aa55; }
