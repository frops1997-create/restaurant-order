<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Food Order</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial;
  margin: 0;
  padding: 20px;
  min-height: 100vh;

  background-image: url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  display: flex;
  justify-content: center;
  align-items: center;
}

.menu-box {
  width: 380px;
  padding: 30px;
  background: rgba(255,255,255,0.9);
  border-radius: 16px;
}

.order-confirm {
  background: green;
  color: white;
  padding: 12px;
  border-radius: 8px;
  margin-top: 10px;
  display: none;
}

label { display:block; margin:6px 0; }

button {
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#007bff;
  color:white;
  border:none;
  border-radius:6px;
}

#kitchenSection, #qrSection {
  display:none;
}

.order {
  border:1px solid #ccc;
  padding:10px;
  margin:10px;
  background:white;
}
</style>
</head>

<body>

<div class="menu-box">
  <h2>Scan & Order</h2>
  <p>Table: <span id="tableNo"></span></p>

  <h3>Menu</h3>
  <label><input type="checkbox" data-price="8" onchange="updateTotal()"> Fried Rice - $8</label>
  <label><input type="checkbox" data-price="10" onchange="updateTotal()"> Beef Noodles - $10</label>
  <label><input type="checkbox" data-price="12" onchange="updateTotal()"> BBQ Pork - $12</label>
  <label><input type="checkbox" data-price="15" onchange="updateTotal()"> BBQ Chicken - $15</label>
  <label><input type="checkbox" data-price="18" onchange="updateTotal()"> BBQ Salmon - $18</label>

  <button id="submitBtn" onclick="submitOrder()">Submit Order</button>
  <p id="total">Total: $0.00</p>

  <div class="order-confirm" id="orderConfirm">
    <p>Order Sent!</p>
    <p>Table: <span id="showTable"></span></p>
    <p>Total: $<span id="showTotal"></span></p>
  </div>
</div>

<div id="kitchenSection">
  <h2>Kitchen Orders</h2>
  <div id="orders"></div>
</div>

<div id="qrSection">
  <h2>QR</h2>
  <input id="tableInput" placeholder="Table">
  <button onclick="generateQR()">Generate</button>
  <div id="qrcode"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(location.search);
let table = params.get('table') || 1;

const isKitchen = params.get('kitchen');
const isAdmin = params.get('admin');

if (!isKitchen) document.getElementById('kitchenSection').style.display = 'none';
if (!isAdmin) document.getElementById('qrSection').style.display = 'none';

document.getElementById('tableNo').innerText = table;

function updateTotal() {
  let total = 0;
  document.querySelectorAll('input:checked').forEach(i=>{
    total += parseFloat(i.dataset.price);
  });
  document.getElementById('total').innerText = "Total: $" + total.toFixed(2);
}

function submitOrder() {
  const btn = document.getElementById('submitBtn');
  if (btn.disabled) return;

  const items = Array.from(document.querySelectorAll('input:checked'));
  if (items.length === 0) {
    alert("Select food");
    return;
  }

  btn.disabled = true;

  let total = 0;
  let list = [];

  items.forEach(i=>{
    total += parseFloat(i.dataset.price);
    list.push(i.parentElement.textContent.trim());
  });

  // ⭐ 不重复 Order Number
  const orderNo = Date.now();

  db.ref('orders').push({
    orderNumber: orderNo,
    table: table,
    items: list,
    total: total,
    time: new Date().toLocaleTimeString()
  });

  document.getElementById('showTable').innerText = table;
  document.getElementById('showTotal').innerText = total.toFixed(2);
  document.getElementById('orderConfirm').style.display = 'block';
}

function loadOrders() {
  db.ref('orders').on('value', snap=>{
    const data = snap.val();
    const out = document.getElementById('orders');
    out.innerHTML = '';

    if (!data) return;

    for (let id in data) {
      const o = data[id];
      const div = document.createElement('div');
      div.className = 'order';

      div.innerHTML = `
        <b>Order #${o.orderNumber} - Table ${o.table}</b><br>
        ${o.items.join(', ')}<br>
        ${o.time}<br>
        <button onclick="completeOrder('${id}')">Done</button>
      `;

      out.appendChild(div);
    }
  });
}

function completeOrder(id){
  db.ref('orders/'+id).remove();
}

function generateQR(){
  const t = document.getElementById('tableInput').value;
  QRCode.toCanvas(document.getElementById('qrcode'),
    location.origin + location.pathname + "?table=" + t);
}

loadOrders();
</script>

</body>
</html>
