<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>港式烧腊点餐 - 多选购物车 | 实时最新订单 | 每日23:45重置</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<!-- QR生成库 -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', 'Arial', sans-serif;
    margin: 0;
    padding: 24px 16px;
    min-height: 100vh;
    background-image: url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .menu-box {
    max-width: 580px;
    width: 100%;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 28px;
    padding: 24px 22px 32px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(2px);
  }

  .back-home {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    background: #6c757d;
    color: white;
    padding: 6px 14px;
    border-radius: 40px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    transition: 0.2s;
  }
  .back-home:hover {
    background: #495057;
    transform: translateX(-2px);
  }

  h2 {
    font-size: 1.9rem;
    margin: 8px 0 4px;
    color: #2c3e2f;
  }
  .table-badge {
    background: #ffedd5;
    display: inline-block;
    padding: 4px 14px;
    border-radius: 32px;
    font-size: 0.9rem;
    font-weight: bold;
    margin-bottom: 18px;
    color: #b45309;
  }

  .menu-items {
    background: #fff8ef;
    border-radius: 24px;
    padding: 12px 16px;
    margin: 16px 0;
    max-height: 380px;
    overflow-y: auto;
  }
  .menu-items label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #ffe0b5;
    font-weight: 500;
    cursor: pointer;
  }
  .menu-items label:last-child {
    border: none;
  }
  input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #d97706;
    flex-shrink: 0;
  }

  .cart-panel {
    background: #fff6e8;
    border-radius: 24px;
    padding: 12px 16px;
    margin: 18px 0;
    border: 1px solid #f5d5a4;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .cart-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    border-bottom: 2px solid #f3cf8a;
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .cart-header h3 {
    margin: 0;
    font-size: 1.3rem;
    color: #92400e;
  }
  .clear-cart-btn {
    background: none;
    border: none;
    color: #b45309;
    font-weight: bold;
    font-size: 0.75rem;
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 30px;
    background-color: #ffede0;
    width: auto;
    margin: 0;
    transition: 0.2s;
  }
  .clear-cart-btn:hover {
    background-color: #ffe0c4;
  }
  .cart-table-info {
    font-size: 0.85rem;
    background: #ffede0;
    padding: 6px 12px;
    border-radius: 30px;
    display: inline-block;
    margin-bottom: 10px;
    color: #b45309;
    font-weight: bold;
  }
  #cartList {
    list-style: none;
    margin: 0 0 10px 0;
    padding: 0;
  }
  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f7e2c0;
    font-size: 0.9rem;
  }
  .cart-item-info {
    flex: 1;
  }
  .cart-item-price {
    font-weight: 700;
    color: #b45309;
    margin-right: 12px;
  }
  .remove-item {
    background: #f1d5b5;
    border: none;
    border-radius: 30px;
    padding: 4px 12px;
    font-size: 0.7rem;
    cursor: pointer;
    font-weight: bold;
    color: #7b3f00;
    width: auto;
    margin: 0;
  }
  .cart-empty-msg {
    color: #b97f3a;
    font-size: 0.85rem;
    text-align: center;
    padding: 12px 0;
  }
  .cart-total {
    text-align: right;
    font-weight: 800;
    font-size: 1.2rem;
    border-top: 1px dashed #eccfa3;
    padding-top: 10px;
    margin-top: 6px;
    color: #854d0e;
  }

  /* 历史订单区域 - 只显示最新一笔订单 */
  .history-panel {
    background: #fef3e2;
    border-radius: 24px;
    padding: 12px 16px;
    margin: 18px 0 10px;
    border: 1px solid #e7cba5;
  }
  .history-header {
    font-weight: bold;
    font-size: 1.2rem;
    color: #9b4e0c;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .latest-order-card {
    background: white;
    border-radius: 18px;
    padding: 12px 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .latest-order-header {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    border-bottom: 1px solid #ffd9a5;
    padding-bottom: 6px;
    margin-bottom: 8px;
  }
  .latest-items {
    color: #4b3b2a;
    margin: 6px 0;
    word-break: break-word;
    font-size: 0.85rem;
  }
  .latest-time {
    font-size: 0.7rem;
    color: #b67e3c;
    text-align: right;
    margin-top: 6px;
  }
  .badge-total {
    background: #f5bc70;
    padding: 2px 12px;
    border-radius: 30px;
    font-size: 0.75rem;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #d97706;
    color: white;
    border: none;
    border-radius: 60px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:disabled {
    background: #c7b59b;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    background: #b45f06;
    transform: scale(0.98);
  }

  .order-confirm {
    background: #2d6a4f;
    color: white;
    padding: 15px;
    border-radius: 24px;
    margin-top: 18px;
    text-align: center;
    position: relative;
  }
  .close-confirm {
    position: absolute;
    top: 8px;
    right: 12px;
    background: none;
    border: none;
    font-size: 20px;
    color: white;
    width: auto;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }

  #kitchenSection, #qrSection {
    margin-top: 20px;
    background: rgba(0,0,0,0.7);
    padding: 20px;
    border-radius: 24px;
    color: white;
    width: 90%;
    max-width: 550px;
  }
  #orders .order {
    background: #2e241f;
    color: #fae6cf;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 16px;
  }
  @media (max-width: 550px) {
    .menu-box { padding: 18px; }
  }
</style>
</head>
<body>

<!-- 正常点餐界面 -->
<div class="menu-box" id="mainApp">
  <a href="https://frops1997-create.github.io/restaurant-order/Main.html" class="back-home">← 返回主页</a>
  <h2>🍖 HK Roasted Food</h2>
  <div class="table-badge">📌 当前桌号: <span id="tableNo">--</span></div>

  <!-- 菜单列表 (多选模式，不限制下单) -->
  <div class="menu-items">
    <h3 style="margin-top:0;">🔥 烧腊精选 (可多选)</h3>
    <label><input type="checkbox" data-name="🍗 HK Roasted Chicken Drumstick 烧鸡腿饭" data-price="7.00"> 1) 烧鸡腿饭 - $7.00</label>
    <label><input type="checkbox" data-name="🍗 HK Roasted Chicken Rice 烧鸡饭" data-price="6.20"> 2) 烧鸡饭 - $6.20</label>
    <label><input type="checkbox" data-name="🦆 HK Roasted Duck Rice 烧鸭饭" data-price="6.50"> 3) 烧鸭饭 - $6.50</label>
    <label><input type="checkbox" data-name="🥩 HK Roasted Pork Rice 烧肉饭" data-price="6.80"> 4) 烧肉饭 - $6.80</label>
    <label><input type="checkbox" data-name="🍖 HK Char Siew Rice 叉烧饭" data-price="6.50"> 5) 叉烧饭 - $6.50</label>
    <label><input type="checkbox" data-name="🍜 HK Char Siew Wanton Noodle 叉烧云吞面" data-price="6.70"> 6) 叉烧云吞面 - $6.70</label>
    <label><input type="checkbox" data-name="🍚 HK Roasted Chicken & Roasted Pork Rice 烧鸡烧肉饭" data-price="7.20"> 7) 烧鸡烧肉饭 - $7.20</label>
    <label><input type="checkbox" data-name="🥣 HK Wanton Soup 云吞汤" data-price="6.00"> 8) 云吞汤 - $6.00</label>
    <label><input type="checkbox" data-name="🥓 HK Roasted Pork 烧肉 (单点)" data-price="5.50"> 9) 烧肉 (单点) - $5.50</label>
    <label><input type="checkbox" data-name="🦆 HK Roasted Duck 烧鸭肉 (单点)" data-price="5.70"> 10) 烧鸭肉 (单点) - $5.70</label>
  </div>

  <!-- 购物车区域：显示桌号 + 所有已选菜品 -->
  <div class="cart-panel">
    <div class="cart-header">
      <h3>🛒 购物车</h3>
      <button class="clear-cart-btn" id="clearCartBtn">清空购物车</button>
    </div>
    <div id="cartTableInfo" class="cart-table-info">🪑 桌号: --</div>
    <ul id="cartList">
      <li class="cart-empty-msg">✨ 暂无菜品，请勾选上方美食</li>
    </ul>
    <div class="cart-total">
      💰 总计: <span id="cartTotalPrice">$0.00</span>
    </div>
  </div>

  <!-- 提交订单按钮 -->
  <button id="submitBtn">📝 立即下单</button>

  <!-- 订单提交成功提示 -->
  <div class="order-confirm" id="orderConfirm" style="display: none;">
    <button class="close-confirm" id="closeConfirmBtn">✖</button>
    <h3>✅ 订单已送达厨房！</h3>
    <p>📋 订单号: <strong id="showOrderNo"></strong></p>
    <p>🪑 桌号: <span id="showTable"></span></p>
    <p>💰 总金额: $<span id="showTotal"></span></p>
    <small>⏳ 烧腊现切，请稍候片刻~</small>
  </div>

  <!-- 历史订单区域 - 只显示最新一份订单 -->
  <div class="history-panel">
    <div class="history-header">
      📜 最新订单记录
      <span style="font-size:12px;">(实时更新)</span>
    </div>
    <div id="latestOrderContainer" class="orders-list">
      <div style="text-align:center; padding:12px;">加载订单记录中...</div>
    </div>
  </div>
</div>

<!-- 厨房专用区域（?kitchen=true） -->
<div id="kitchenSection" style="display:none;">
  <h2>👨‍🍳 厨房订单看板</h2>
  <div id="orders"></div>
</div>

<!-- 管理员二维码生成（?admin=true） -->
<div id="qrSection" style="display:none;">
  <h2>📱 生成桌号二维码</h2>
  <input type="number" id="tableInput" placeholder="输入桌号">
  <button onclick="generateQR()">生成 QR Code</button>
  <div id="qrcode" style="margin-top:10px;"></div>
</div>

<script>
  // ----------------------------- Firebase 配置 -----------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
    authDomain: "restaurants-cs.firebaseapp.com",
    databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "restaurants-cs",
    storageBucket: "restaurants-cs.firebasestorage.app",
    messagingSenderId: "209872919844",
    appId: "1:209872919844:web:c1730801cd51d615e867b1"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ----------------------------- URL参数解析 -----------------------------
  const urlParams = new URLSearchParams(location.search);
  const isKitchen = urlParams.get('kitchen');
  const isAdmin = urlParams.get('admin');
  const tableFromUrl = urlParams.get('table');
 let currentTable = Number(tableFromUrl) || 2255;

  // DOM 元素
  const tableNoSpan = document.getElementById('tableNo');
  const cartTableInfoSpan = document.getElementById('cartTableInfo');
  const cartListEl = document.getElementById('cartList');
  const cartTotalSpan = document.getElementById('cartTotalPrice');
  const submitBtn = document.getElementById('submitBtn');
  const clearCartBtn = document.getElementById('clearCartBtn');
  const orderConfirmDiv = document.getElementById('orderConfirm');
  const closeConfirmBtn = document.getElementById('closeConfirmBtn');
  const latestOrderContainer = document.getElementById('latestOrderContainer');

  function updateTableDisplay() {
    if (tableNoSpan) tableNoSpan.textContent = currentTable;
    if (cartTableInfoSpan) cartTableInfoSpan.innerHTML = `🪑 当前桌号: ${currentTable}`;
  }
  updateTableDisplay();

  // 控制视图
  if (isKitchen) {
    document.getElementById('kitchenSection').style.display = 'block';
    document.getElementById('mainApp').style.display = 'none';
  }
  if (isAdmin) {
    document.getElementById('qrSection').style.display = 'block';
    document.getElementById('mainApp').style.display = 'none';
  }
  if (!isKitchen && !isAdmin) {
    document.getElementById('kitchenSection').style.display = 'none';
    document.getElementById('qrSection').style.display = 'none';
  }

  // ----------------------------- 全局变量 -----------------------------
  let cartItems = [];        // 购物车数组 [{ name, price }]
  const checkboxes = document.querySelectorAll('.menu-items input[type="checkbox"]');
  let orderCounter = 1;
  let lastResetDate = null;
  let ordersListenerRef = null;

  // 日期工具
  function getCurrentDateStr() {
    const now = new Date();
    return `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
  }

  // 每日23:45后重置桌号为1，订单计数器为1
  async function checkAndResetDaily() {
    const now = new Date();
    const currentHour = now.getHours();
    const currentMinute = now.getMinutes();
    const todayStr = getCurrentDateStr();
    const isAfter2345 = (currentHour > 23 || (currentHour === 23 && currentMinute >= 45));
    
    if (isAfter2345 && lastResetDate !== todayStr) {
      try {
        await db.ref('orderCounter').set(1);
        orderCounter = 1;
        currentTable = 1;
        updateTableDisplay();
        // 重新加载历史订单监听（桌号变化）
        setupLatestOrderListener();  // 重新绑定
        lastResetDate = todayStr;
        const toast = document.createElement('div');
        toast.textContent = '🔄 系统已重置：桌号变为1号，订单号从1开始 (每日23:45更新)';
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = '#2d6a4f';
        toast.style.color = 'white';
        toast.style.padding = '8px 16px';
        toast.style.borderRadius = '40px';
        toast.style.fontSize = '12px';
        toast.style.zIndex = '999';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
        console.log(`[重置] ${todayStr} 23:45 桌号=1, orderCounter=1`);
      } catch (err) {
        console.error('每日重置失败:', err);
      }
    }
  }

  function startDailyResetWatcher() {
    checkAndResetDaily();
    setInterval(checkAndResetDaily, 30000);
  }

  async function refreshOrderCounter() {
    try {
      const snap = await db.ref('orderCounter').once('value');
      orderCounter = snap.val() || 1;
    } catch(e) { console.warn(e); }
  }

  // ----------------------------- 购物车渲染 (多选模式) -----------------------------
  function renderCart() {
    if (!cartListEl) return;
    if (cartItems.length === 0) {
      cartListEl.innerHTML = '<li class="cart-empty-msg">🍽️ 购物车空，请勾选上方美食</li>';
      cartTotalSpan.innerText = '$0.00';
      return;
    }
    let html = '';
    let total = 0;
    cartItems.forEach((item, idx) => {
      total += item.price;
      html += `
        <li class="cart-item">
          <div class="cart-item-info">${item.name}</div>
          <div class="cart-item-price">$${item.price.toFixed(2)}</div>
          <button class="remove-item" data-index="${idx}">移除</button>
        </li>
      `;
    });
    cartListEl.innerHTML = html;
    cartTotalSpan.innerText = `$${total.toFixed(2)}`;
    
    document.querySelectorAll('.remove-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const index = parseInt(btn.getAttribute('data-index'));
        if (!isNaN(index)) removeFromCart(index);
      });
    });
  }

  function removeFromCart(index) {
    if (index < 0 || index >= cartItems.length) return;
    const removed = cartItems[index];
    for (let cb of checkboxes) {
      if (cb.getAttribute('data-name') === removed.name) {
        cb.checked = false;
        break;
      }
    }
    cartItems.splice(index, 1);
    renderCart();
    updateSubmitButtonState();
  }

  function clearCart() {
    for (let cb of checkboxes) cb.checked = false;
    cartItems = [];
    renderCart();
    updateSubmitButtonState();
  }

  function syncCartFromCheckboxes() {
    const newCart = [];
    for (let cb of checkboxes) {
      if (cb.checked) {
        const name = cb.getAttribute('data-name');
        const price = parseFloat(cb.getAttribute('data-price'));
        if (name && !isNaN(price)) {
          newCart.push({ name, price });
        }
      }
    }
    cartItems = newCart;
    renderCart();
    updateSubmitButtonState();
  }

  function updateSubmitButtonState() {
    if (submitBtn) {
      if (cartItems.length === 0) {
        submitBtn.disabled = true;
        submitBtn.innerText = '请选择菜品';
      } else {
        submitBtn.disabled = false;
        submitBtn.innerText = '✅ 确认下单';
      }
    }
  }

  function handleCheckboxChange() {
    syncCartFromCheckboxes();
  }

  function bindCheckboxEvents() {
    for (let cb of checkboxes) {
      cb.removeEventListener('change', handleCheckboxChange);
      cb.addEventListener('change', handleCheckboxChange);
    }
  }

  // ----------------------------- 提交订单 (提交所有购物车菜品) -----------------------------
  async function submitOrder() {
    if (cartItems.length === 0) {
      alert('请先选择菜品再下单！');
      return;
    }
    if (submitBtn.disabled) return;
    
    submitBtn.disabled = true;
    const originalText = submitBtn.innerText;
    submitBtn.innerText = "⏳ 提交订单中...";
    
    let total = 0;
    let itemsList = [];
    for (let item of cartItems) {
      total += item.price;
      itemsList.push(item.name);
    }
    const totalFixed = total.toFixed(2);
    
    let orderNumber = orderCounter;
    try {
      const counterSnap = await db.ref('orderCounter').once('value');
      let latest = counterSnap.val() || 1;
      orderNumber = latest;
      await db.ref('orderCounter').set(latest + 1);
      orderCounter = latest + 1;
    } catch(e) {
      console.error(e);
      orderNumber = Date.now() % 10000;
    }
    
    const newOrder = {
      orderNo: orderNumber,
      table: currentTable,
      items: itemsList,
      total: totalFixed,
      time: new Date().toLocaleString('zh-CN', { hour12: false }),
      timestamp: firebase.database.ServerValue.TIMESTAMP
    };
    
    try {
      await db.ref('orders').push(newOrder);
      document.getElementById('showOrderNo').innerText = orderNumber;
      document.getElementById('showTable').innerText = currentTable;
      document.getElementById('showTotal').innerText = totalFixed;
      orderConfirmDiv.style.display = 'block';
      clearCart();  // 下单后清空购物车
      
      // 【关键修复】立即强制刷新最新订单显示，确保刚刚下的单能立即出现
      setTimeout(() => {
        setupLatestOrderListener();
      }, 100);
      
      setTimeout(() => { if (orderConfirmDiv) orderConfirmDiv.style.display = 'none'; }, 4000);
    } catch (error) {
      console.error("下单失败:", error);
      alert("网络繁忙，请稍后重试");
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = originalText;
      updateSubmitButtonState();
    }
  }
  
  // ----------------------------- 最新订单监听 (只显示该桌最新一笔订单) -----------------------------
  function setupLatestOrderListener() {
    // 移除旧监听
    if (ordersListenerRef) {
      ordersListenerRef.off('value');
      ordersListenerRef = null;
    }
    // 重新建立查询
   const query = db.ref('orders')
  .orderByChild('table')
  .equalTo(Number(currentTable));
    ordersListenerRef = query;
    ordersListenerRef.on('value', (snapshot) => {
      console.log('[最新订单] 收到数据更新', snapshot.exists() ? '有数据' : '无数据');
      const ordersData = snapshot.val();
      if (!ordersData) {
        latestOrderContainer.innerHTML = '<div style="text-align:center; padding:12px;">📭 暂无订单，点一份烧腊开启美味～</div>';
        return;
      }
      let ordersArray = [];
      for (let key in ordersData) {
        ordersArray.push({ id: key, ...ordersData[key] });
      }
      // 按订单号倒序取第一个（最新订单）
      ordersArray.sort((a, b) => {
  return (b.timestamp || 0) - (a.timestamp || 0);
});
      const latest = ordersArray[0];
      const itemsShort = latest.items.join('、');
      const html = `
        <div class="latest-order-card">
          <div class="latest-order-header">
            <span>🧾 订单 #${latest.orderNo}</span>
            <span class="badge-total">$${latest.total}</span>
          </div>
          <div class="latest-items">🍽️ ${itemsShort}</div>
          <div class="latest-time">⏱️ ${latest.time || '刚刚'}</div>
        </div>
      `;
      latestOrderContainer.innerHTML = html;
      console.log('[最新订单] 已更新显示最新订单 #' + latest.orderNo);
    }, (error) => {
      console.error("读取最新订单失败:", error);
      latestOrderContainer.innerHTML = '<div>⚠️ 加载失败，请刷新页面</div>';
    });
  }
  
  // ----------------------------- 厨房功能 (不变) -----------------------------
  function loadKitchenOrders() {
    if (!isKitchen) return;
    const ordersDiv = document.getElementById('orders');
    if (!ordersDiv) return;
    db.ref('orders').on('value', snap => {
      const data = snap.val();
      ordersDiv.innerHTML = '';
      if (!data) { ordersDiv.innerHTML = '<p>暂无新订单</p>'; return; }
      for (let id in data) {
        const o = data[id];
        const div = document.createElement('div');
        div.className = 'order';
        div.innerHTML = `<b>订单 #${o.orderNo}</b><br><b>桌号 ${o.table}</b><br>总计: $${o.total}<br>${o.items.join(', ')}<br>${o.time || ''}<br>
        <button onclick="window.completeOrder('${id}')">✅ 完成出餐</button>`;
        ordersDiv.appendChild(div);
      }
    });
  }
  
  window.completeOrder = function(orderId) {
    if (confirm('确认此订单已完成？将移出厨房列表')) {
      db.ref('orders/' + orderId).remove().catch(err => alert("删除失败:" + err));
    }
  };
  
  window.generateQR = function() {
    const t = document.getElementById('tableInput').value;
    if (!t) { alert('请输入桌号'); return; }
    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = '';
    let baseUrl;

if (location.protocol === 'file:') {
  baseUrl = `http://127.0.0.1:5500${location.pathname.substring(location.pathname.lastIndexOf('/'))}`;
} else {
  baseUrl = `${location.origin}${location.pathname}`;
}

const orderUrl = `${baseUrl}?table=${t}`;
    QRCode.toCanvas(qrContainer, orderUrl, { width: 180, margin: 1 }, (err) => {
      if (err) console.error(err);
    });
  };
  
  // ----------------------------- 初始化顾客界面 -----------------------------
  async function initCustomerUI() {
    for (let cb of checkboxes) cb.checked = false;
    cartItems = [];
    renderCart();
    bindCheckboxEvents();
    updateSubmitButtonState();
    await refreshOrderCounter();
    
    if (clearCartBtn) clearCartBtn.addEventListener('click', clearCart);
    if (submitBtn) submitBtn.addEventListener('click', submitOrder);
    if (closeConfirmBtn) closeConfirmBtn.addEventListener('click', () => {
      orderConfirmDiv.style.display = 'none';
    });
    setupLatestOrderListener();
    startDailyResetWatcher();
  }
  
  // ----------------------------- 启动 -----------------------------
  if (isKitchen) {
    loadKitchenOrders();
  } else if (isAdmin) {
    db.ref('orderCounter').once('value', snap => {
      if (!snap.val()) db.ref('orderCounter').set(1);
    });
  } else {
    initCustomerUI();
  }
  
  db.ref('orderCounter').once('value', snap => {
    if (!snap.val()) db.ref('orderCounter').set(1);
  });
  
  console.log(`当前模式: 顾客桌号=${currentTable} | 购物车支持多选，每日23:45重置桌号=1 & 订单号归1 | 最新订单实时更新`);
</script>
</body>
</html>
