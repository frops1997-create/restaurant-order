<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>HK Roasted Food 双语点餐系统</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<!-- QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',sans-serif;
  margin:0;
  padding:24px 16px;
  min-height:100vh;
  background-image:url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  display:flex;
  justify-content:center;
  align-items:center;
}

.menu-box{
  max-width:580px;
  width:100%;
  background:rgba(255,255,255,0.95);
  border-radius:28px;
  padding:24px 22px 32px;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

.back-home{
  display:inline-flex;
  align-items:center;
  text-decoration:none;
  background:#6c757d;
  color:white;
  padding:6px 14px;
  border-radius:40px;
  font-size:13px;
  margin-bottom:16px;
}

h2{
  margin:10px 0;
}

.table-badge{
  background:#ffedd5;
  display:inline-block;
  padding:6px 14px;
  border-radius:30px;
  color:#b45309;
  font-weight:bold;
  margin-bottom:16px;
}

.menu-items{
  background:#fff8ef;
  border-radius:24px;
  padding:12px 16px;
  margin:16px 0;
}

.menu-items label{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #ffe0b5;
  cursor:pointer;
}

.menu-items label:last-child{
  border:none;
}

input[type="checkbox"]{
  width:20px;
  height:20px;
  accent-color:#d97706;
}

.cart-panel{
  background:#fff6e8;
  border-radius:24px;
  padding:16px;
  border:1px solid #f5d5a4;
  margin-top:18px;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.clear-cart-btn{
  width:auto;
  padding:6px 12px;
  border:none;
  border-radius:30px;
  background:#ffede0;
  color:#b45309;
  cursor:pointer;
  font-weight:bold;
}

.cart-table-info{
  margin-top:10px;
  background:#ffede0;
  display:inline-block;
  padding:6px 12px;
  border-radius:30px;
  color:#b45309;
  font-size:14px;
}

#cartList{
  list-style:none;
  padding:0;
  margin:12px 0;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #f7e2c0;
}

.remove-item{
  background:#f1d5b5;
  border:none;
  border-radius:20px;
  padding:4px 10px;
  cursor:pointer;
}

.cart-total{
  text-align:right;
  font-weight:bold;
  font-size:18px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:60px;
  background:#d97706;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

button:disabled{
  background:#c7b59b;
}

.order-confirm{
  background:#2d6a4f;
  color:white;
  padding:16px;
  border-radius:24px;
  margin-top:16px;
  text-align:center;
}

.history-panel{
  background:#fef3e2;
  border-radius:24px;
  padding:16px;
  margin-top:18px;
}

.latest-order-card{
  background:white;
  border-radius:18px;
  padding:12px;
}

.latest-order-header{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}

.badge-total{
  background:#f5bc70;
  padding:2px 12px;
  border-radius:30px;
}

.cart-empty-msg{
  text-align:center;
  color:#999;
  padding:12px;
}
</style>
</head>

<body>

<div class="menu-box">

<a href="https://frops1997-create.github.io/restaurant-order/Main.html"
class="back-home">
← 返回主页
</a>

<div style="text-align:right;">
<button id="langToggleBtn"
style="width:auto;background:#374151;">
🌐 English
</button>
</div>

<h2 id="mainTitle">🍖 HK Roasted Food</h2>

<div class="table-badge">
📌 当前桌号:
<span id="tableNo">--</span>
</div>

<div class="menu-items">

<h3 id="menuTitle">🔥 烧腊精选 (可多选)</h3>

<label class="menu-label"
data-cn="1) 烧鸡腿饭 - $7.00"
data-en="1) Roasted Chicken Drumstick Rice - $7.00">

<input type="checkbox"
data-name-cn="🍗 烧鸡腿饭"
data-name-en="🍗 Roasted Chicken Drumstick Rice"
data-price="7.00">

<span>1) 烧鸡腿饭 - $7.00</span>
</label>

<label class="menu-label"
data-cn="2) 烧鸡饭 - $6.20"
data-en="2) Roasted Chicken Rice - $6.20">

<input type="checkbox"
data-name-cn="🍗 烧鸡饭"
data-name-en="🍗 Roasted Chicken Rice"
data-price="6.20">

<span>2) 烧鸡饭 - $6.20</span>
</label>

<label class="menu-label"
data-cn="3) 烧鸭饭 - $6.50"
data-en="3) Roasted Duck Rice - $6.50">

<input type="checkbox"
data-name-cn="🦆 烧鸭饭"
data-name-en="🦆 Roasted Duck Rice"
data-price="6.50">

<span>3) 烧鸭饭 - $6.50</span>
</label>

<label class="menu-label"
data-cn="4) 烧肉饭 - $6.80"
data-en="4) Roasted Pork Rice - $6.80">

<input type="checkbox"
data-name-cn="🥩 烧肉饭"
data-name-en="🥩 Roasted Pork Rice"
data-price="6.80">

<span>4) 烧肉饭 - $6.80</span>
</label>

<label class="menu-label"
data-cn="5) 叉烧饭 - $6.50"
data-en="5) Char Siew Rice - $6.50">

<input type="checkbox"
data-name-cn="🍖 叉烧饭"
data-name-en="🍖 Char Siew Rice"
data-price="6.50">

<span>5) 叉烧饭 - $6.50</span>
</label>

</div>

<div class="cart-panel">

<div class="cart-header">
<h3 id="cartTitle">🛒 购物车</h3>

<button class="clear-cart-btn"
id="clearCartBtn">
清空购物车
</button>
</div>

<div id="cartTableInfo"
class="cart-table-info">
🪑 当前桌号: --
</div>

<ul id="cartList">
<li class="cart-empty-msg">
🍽️ 购物车空，请勾选上方美食
</li>
</ul>

<div class="cart-total">
💰 Total:
<span id="cartTotalPrice">$0.00</span>
</div>

</div>

<button id="submitBtn" disabled>
请选择菜品
</button>

<div class="order-confirm"
id="orderConfirm"
style="display:none;">

<h3>✅ 订单已送达厨房！</h3>

<p>
📋 Order #
<strong id="showOrderNo"></strong>
</p>

<p>
🪑 Table:
<span id="showTable"></span>
</p>

<p>
💰 Total:
$<span id="showTotal"></span>
</p>

</div>

<div class="history-panel">

<div style="font-weight:bold;margin-bottom:12px;">
📜 最新订单记录
</div>

<div id="latestOrderContainer">
加载中...
</div>

</div>

</div>

<script>

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs",
  storageBucket: "restaurants-cs.firebasestorage.app",
  messagingSenderId: "209872919844",
  appId: "1:209872919844:web:c1730801cd51d615e867b1"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const urlParams = new URLSearchParams(location.search);

const tableFromUrl = urlParams.get('table');

let currentTable = Number(tableFromUrl) || 2255;

document.getElementById('tableNo').innerText =
currentTable;

document.getElementById('cartTableInfo').innerHTML =
`🪑 当前桌号: ${currentTable}`;

const checkboxes =
document.querySelectorAll('input[type="checkbox"]');

const cartListEl =
document.getElementById('cartList');

const cartTotalSpan =
document.getElementById('cartTotalPrice');

const submitBtn =
document.getElementById('submitBtn');

const clearCartBtn =
document.getElementById('clearCartBtn');

let cartItems = [];

// 语言
let currentLang='cn';

const langData={

cn:{
menu:"🔥 烧腊精选 (可多选)",
cart:"🛒 购物车",
clear:"清空购物车",
submit:"✅ 确认下单",
choose:"请选择菜品",
empty:"🍽️ 购物车空，请勾选上方美食"
},

en:{
menu:"🔥 Signature Roasted Menu",
cart:"🛒 Shopping Cart",
clear:"Clear Cart",
submit:"✅ Place Order",
choose:"Please Select Food",
empty:"🍽️ Cart Empty"
}

};

function renderCart(){

if(cartItems.length===0){

cartListEl.innerHTML=
`<li class="cart-empty-msg">
${langData[currentLang].empty}
</li>`;

cartTotalSpan.innerText='$0.00';

submitBtn.disabled=true;

submitBtn.innerText=
langData[currentLang].choose;

return;
}

let html='';
let total=0;

cartItems.forEach((item,index)=>{

total += item.price;

html += `
<li class="cart-item">

<div>${item.name}</div>

<div>
<span style="font-weight:bold;color:#b45309;">
$${item.price.toFixed(2)}
</span>

<button class="remove-item"
onclick="removeItem(${index})">
X
</button>

</div>

</li>
`;
});

cartListEl.innerHTML = html;

cartTotalSpan.innerText =
`$${total.toFixed(2)}`;

submitBtn.disabled=false;

submitBtn.innerText=
langData[currentLang].submit;
}

function removeItem(index){

const removed = cartItems[index];

checkboxes.forEach(cb=>{

const name =
cb.getAttribute('data-name');

if(name===removed.name){
cb.checked=false;
}
});

cartItems.splice(index,1);

renderCart();
}

checkboxes.forEach(cb=>{

cb.addEventListener('change',()=>{

cartItems=[];

checkboxes.forEach(c=>{

if(c.checked){

cartItems.push({

name:c.getAttribute('data-name'),

price:parseFloat(
c.getAttribute('data-price')
)

});
}
});

renderCart();
});
});

clearCartBtn.onclick=()=>{

checkboxes.forEach(c=>c.checked=false);

cartItems=[];

renderCart();
};

async function submitOrder(){

if(cartItems.length===0)return;

let total=0;

let items=[];

cartItems.forEach(i=>{

total += i.price;

items.push(i.name);

});

const totalFixed=total.toFixed(2);

const snap =
await db.ref('orderCounter').once('value');

let orderNo=snap.val() || 1;

await db.ref('orderCounter')
.set(orderNo+1);

const newOrder={

orderNo:orderNo,

table:currentTable,

items:items,

total:totalFixed,

time:new Date().toLocaleString(),

timestamp:Date.now()
};

await db.ref('orders').push(newOrder);

document.getElementById('showOrderNo')
.innerText=orderNo;

document.getElementById('showTable')
.innerText=currentTable;

document.getElementById('showTotal')
.innerText=totalFixed;

document.getElementById('orderConfirm')
.style.display='block';

setTimeout(()=>{

document.getElementById('orderConfirm')
.style.display='none';

},4000);

clearCartBtn.click();
}

submitBtn.onclick=submitOrder;

// 最新订单实时监听
function setupLatestOrderListener(){

const latestOrderContainer =
document.getElementById(
'latestOrderContainer'
);

db.ref('orders')
.orderByChild('table')
.equalTo(Number(currentTable))
.on('value',(snapshot)=>{

const data = snapshot.val();

if(!data){

latestOrderContainer.innerHTML=`
<div style="text-align:center;padding:12px;">
📭 暂无订单
</div>
`;

return;
}

let ordersArray=[];

for(let key in data){

ordersArray.push({
id:key,
...data[key]
});
}

ordersArray.sort((a,b)=>{

return (b.timestamp||0) -
(a.timestamp||0);

});

const latest=ordersArray[0];

latestOrderContainer.innerHTML=`

<div class="latest-order-card">

<div class="latest-order-header">

<span>
🧾 Order #${latest.orderNo}
</span>

<span class="badge-total">
$${latest.total}
</span>

</div>

<div style="margin-top:10px;">
🍽️ ${latest.items.join('、')}
</div>

<div style="
margin-top:8px;
font-size:12px;
color:#999;
text-align:right;
">
⏱️ ${latest.time}
</div>

</div>
`;
});
}

// 双语切换
document.getElementById('langToggleBtn')
.onclick=()=>{

currentLang =
currentLang==='cn'
? 'en'
: 'cn';

updateLanguage();
};

function updateLanguage(){

document.getElementById('menuTitle')
.innerText=
langData[currentLang].menu;

document.getElementById('cartTitle')
.innerText=
langData[currentLang].cart;

clearCartBtn.innerText=
langData[currentLang].clear;

document.getElementById('langToggleBtn')
.innerText=
currentLang==='cn'
? '🌐 English'
: '🌐 中文';

document.querySelectorAll('.menu-label')
.forEach(label=>{

const text=
currentLang==='cn'
? label.dataset.cn
: label.dataset.en;

label.querySelector('span')
.innerText=text;

const checkbox=
label.querySelector('input');

checkbox.setAttribute(
'data-name',

currentLang==='cn'
? checkbox.dataset.nameCn
: checkbox.dataset.nameEn
);
});

renderCart();
}

updateLanguage();

renderCart();

setupLatestOrderListener();

</script>

</body>
</html>
