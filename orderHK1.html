<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>港式烧腊点餐 - 双语版</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<!-- QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',sans-serif;
  margin:0;
  padding:24px 16px;
  min-height:100vh;
  background-image:url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  display:flex;
  justify-content:center;
  align-items:center;
}

.menu-box{
  max-width:580px;
  width:100%;
  background:rgba(255,255,255,0.95);
  border-radius:28px;
  padding:24px 22px 32px;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

.back-home{
  display:inline-flex;
  align-items:center;
  text-decoration:none;
  background:#6c757d;
  color:white;
  padding:6px 14px;
  border-radius:40px;
  font-size:13px;
  font-weight:500;
  margin-bottom:16px;
}

h2{
  margin:8px 0 4px;
}

.table-badge{
  background:#ffedd5;
  display:inline-block;
  padding:4px 14px;
  border-radius:32px;
  font-size:0.9rem;
  font-weight:bold;
  margin-bottom:18px;
  color:#b45309;
}

.menu-items{
  background:#fff8ef;
  border-radius:24px;
  padding:12px 16px;
  margin:16px 0;
  max-height:380px;
  overflow-y:auto;
}

.menu-items label{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid #ffe0b5;
  font-weight:500;
  cursor:pointer;
}

.menu-items label:last-child{
  border:none;
}

input[type="checkbox"]{
  width:20px;
  height:20px;
  accent-color:#d97706;
}

.cart-panel{
  background:#fff6e8;
  border-radius:24px;
  padding:12px 16px;
  margin:18px 0;
  border:1px solid #f5d5a4;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.clear-cart-btn{
  width:auto;
  padding:6px 14px;
  border-radius:30px;
  background:#ffede0;
  color:#b45309;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.cart-table-info{
  font-size:0.85rem;
  background:#ffede0;
  padding:6px 12px;
  border-radius:30px;
  display:inline-block;
  margin-bottom:10px;
  color:#b45309;
  font-weight:bold;
}

#cartList{
  list-style:none;
  padding:0;
  margin:0;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #f7e2c0;
}

.cart-item-price{
  font-weight:bold;
  color:#b45309;
}

.remove-item{
  background:#f1d5b5;
  border:none;
  border-radius:30px;
  padding:4px 10px;
  cursor:pointer;
}

.cart-empty-msg{
  text-align:center;
  color:#b97f3a;
}

.cart-total{
  text-align:right;
  font-weight:bold;
  margin-top:12px;
}

button{
  width:100%;
  padding:12px;
  margin-top:12px;
  background:#d97706;
  color:white;
  border:none;
  border-radius:60px;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#c7b59b;
}

.order-confirm{
  background:#2d6a4f;
  color:white;
  padding:15px;
  border-radius:24px;
  margin-top:18px;
  text-align:center;
  position:relative;
}

.close-confirm{
  position:absolute;
  top:8px;
  right:12px;
  background:none;
  border:none;
  color:white;
  font-size:20px;
  width:auto;
}

.history-panel{
  background:#fef3e2;
  border-radius:24px;
  padding:12px 16px;
  margin-top:18px;
}

.latest-order-card{
  background:white;
  border-radius:18px;
  padding:12px;
}

.latest-order-header{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}

.badge-total{
  background:#f5bc70;
  padding:2px 12px;
  border-radius:30px;
}

#kitchenSection,
#qrSection{
  margin-top:20px;
  background:rgba(0,0,0,0.7);
  padding:20px;
  border-radius:24px;
  color:white;
  width:90%;
  max-width:550px;
}
</style>
</head>

<body>

<div class="menu-box" id="mainApp">

<a href="https://frops1997-create.github.io/restaurant-order/Main.html" class="back-home">
← 返回主页
</a>

<!-- 🌐 双语按钮 -->
<div style="text-align:right;">
  <button id="langToggleBtn" style="width:auto;background:#374151;">
    🌐 English
  </button>
</div>

<h2 id="mainTitle">🍖 HK Roasted Food</h2>

<div class="table-badge">
📌 当前桌号:
<span id="tableNo">--</span>
</div>

<div class="menu-items">

<h3 id="menuTitle">🔥 烧腊精选 (可多选)</h3>

<label class="menu-label"
data-cn="1) 烧鸡腿饭 - $7.00"
data-en="1) Roasted Chicken Drumstick Rice - $7.00">

<input type="checkbox"
data-name-cn="🍗 烧鸡腿饭"
data-name-en="🍗 Roasted Chicken Drumstick Rice"
data-price="7.00">

<span>1) 烧鸡腿饭 - $7.00</span>
</label>

<label class="menu-label"
data-cn="2) 烧鸡饭 - $6.20"
data-en="2) Roasted Chicken Rice - $6.20">

<input type="checkbox"
data-name-cn="🍗 烧鸡饭"
data-name-en="🍗 Roasted Chicken Rice"
data-price="6.20">

<span>2) 烧鸡饭 - $6.20</span>
</label>

<label class="menu-label"
data-cn="3) 烧鸭饭 - $6.50"
data-en="3) Roasted Duck Rice - $6.50">

<input type="checkbox"
data-name-cn="🦆 烧鸭饭"
data-name-en="🦆 Roasted Duck Rice"
data-price="6.50">

<span>3) 烧鸭饭 - $6.50</span>
</label>

<label class="menu-label"
data-cn="4) 烧肉饭 - $6.80"
data-en="4) Roasted Pork Rice - $6.80">

<input type="checkbox"
data-name-cn="🥩 烧肉饭"
data-name-en="🥩 Roasted Pork Rice"
data-price="6.80">

<span>4) 烧肉饭 - $6.80</span>
</label>

<label class="menu-label"
data-cn="5) 叉烧饭 - $6.50"
data-en="5) Char Siew Rice - $6.50">

<input type="checkbox"
data-name-cn="🍖 叉烧饭"
data-name-en="🍖 Char Siew Rice"
data-price="6.50">

<span>5) 叉烧饭 - $6.50</span>
</label>

</div>

<div class="cart-panel">

<div class="cart-header">
<h3 id="cartTitle">🛒 购物车</h3>

<button class="clear-cart-btn" id="clearCartBtn">
清空购物车
</button>
</div>

<div id="cartTableInfo" class="cart-table-info">
🪑 桌号: --
</div>

<ul id="cartList">
<li class="cart-empty-msg">
🍽️ 购物车空，请勾选上方美食
</li>
</ul>

<div class="cart-total">
💰 总计:
<span id="cartTotalPrice">$0.00</span>
</div>

</div>

<button id="submitBtn">
请选择菜品
</button>

<div class="order-confirm" id="orderConfirm" style="display:none;">

<button class="close-confirm" id="closeConfirmBtn">
✖
</button>

<h3>✅ 订单已送达厨房！</h3>

<p>
📋 订单号:
<strong id="showOrderNo"></strong>
</p>

<p>
🪑 桌号:
<span id="showTable"></span>
</p>

<p>
💰 总金额:
$<span id="showTotal"></span>
</p>

</div>

<div class="history-panel">

<div class="history-header">
📜 最新订单记录
</div>

<div id="latestOrderContainer">
加载中...
</div>

</div>

</div>

<!-- 厨房 -->
<div id="kitchenSection" style="display:none;">
<h2>👨‍🍳 厨房订单看板</h2>
<div id="orders"></div>
</div>

<!-- QR -->
<div id="qrSection" style="display:none;">
<h2>📱 QR Code</h2>
<input type="number" id="tableInput" placeholder="输入桌号">
<button onclick="generateQR()">生成 QR</button>
<div id="qrcode"></div>
</div>

<script>

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs",
  storageBucket: "restaurants-cs.firebasestorage.app",
  messagingSenderId: "209872919844",
  appId: "1:209872919844:web:c1730801cd51d615e867b1"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const urlParams = new URLSearchParams(location.search);

const isKitchen = urlParams.get('kitchen');
const isAdmin = urlParams.get('admin');

const tableFromUrl = urlParams.get('table');

let currentTable = Number(tableFromUrl) || 2255;

const tableNoSpan = document.getElementById('tableNo');
const cartTableInfoSpan = document.getElementById('cartTableInfo');
const cartListEl = document.getElementById('cartList');
const cartTotalSpan = document.getElementById('cartTotalPrice');
const submitBtn = document.getElementById('submitBtn');
const clearCartBtn = document.getElementById('clearCartBtn');

const orderConfirmDiv = document.getElementById('orderConfirm');

const checkboxes =
document.querySelectorAll('.menu-items input[type="checkbox"]');

let cartItems = [];

function updateTableDisplay(){
  tableNoSpan.textContent = currentTable;
  cartTableInfoSpan.innerHTML = `🪑 当前桌号: ${currentTable}`;
}

updateTableDisplay();

function renderCart(){

  if(cartItems.length===0){

    cartListEl.innerHTML =
    `<li class="cart-empty-msg">
      ${langData[currentLang].empty}
    </li>`;

    cartTotalSpan.innerText='$0.00';
    return;
  }

  let html='';
  let total=0;

  cartItems.forEach((item,idx)=>{

    total += item.price;

    html += `
    <li class="cart-item">

      <div>${item.name}</div>

      <div class="cart-item-price">
        $${item.price.toFixed(2)}
      </div>

      <button class="remove-item"
      data-index="${idx}">
      X
      </button>

    </li>`;
  });

  cartListEl.innerHTML = html;

  cartTotalSpan.innerText =
  `$${total.toFixed(2)}`;

  document.querySelectorAll('.remove-item')
  .forEach(btn=>{

    btn.onclick=()=>{

      const idx =
      parseInt(btn.dataset.index);

      cartItems.splice(idx,1);

      checkboxes[idx].checked=false;

      renderCart();

      updateSubmitButtonState();
    };
  });
}

function updateSubmitButtonState(){

  if(cartItems.length===0){

    submitBtn.disabled=true;

    submitBtn.innerText =
    langData[currentLang].choose;

  }else{

    submitBtn.disabled=false;

    submitBtn.innerText =
    langData[currentLang].submit;
  }
}

checkboxes.forEach(cb=>{

  cb.addEventListener('change',()=>{

    cartItems=[];

    checkboxes.forEach(c=>{

      if(c.checked){

        cartItems.push({
          name:c.getAttribute('data-name'),
          price:parseFloat(c.dataset.price)
        });
      }
    });

    renderCart();

    updateSubmitButtonState();
  });
});

clearCartBtn.onclick=()=>{

  checkboxes.forEach(c=>c.checked=false);

  cartItems=[];

  renderCart();

  updateSubmitButtonState();
};

async function submitOrder(){

  if(cartItems.length===0)return;

  let total=0;

  let items=[];

  cartItems.forEach(i=>{

    total += i.price;

    items.push(i.name);
  });

  const totalFixed=total.toFixed(2);

  const snap =
  await db.ref('orderCounter').once('value');

  let orderNo=snap.val() || 1;

  await db.ref('orderCounter')
  .set(orderNo+1);

  const newOrder = {

    orderNo:orderNo,

    table:currentTable,

    items:items,

    total:totalFixed,

    time:new Date().toLocaleString()
  };

  await db.ref('orders').push(newOrder);

  document.getElementById('showOrderNo')
  .innerText = orderNo;

  document.getElementById('showTable')
  .innerText = currentTable;

  document.getElementById('showTotal')
  .innerText = totalFixed;

  orderConfirmDiv.style.display='block';

  clearCartBtn.click();

  setTimeout(()=>{
    orderConfirmDiv.style.display='none';
  },4000);
}

submitBtn.onclick=submitOrder;

// 双语
let currentLang='cn';

const langData = {

  cn:{
    menu:"🔥 烧腊精选 (可多选)",
    cart:"🛒 购物车",
    clear:"清空购物车",
    submit:"✅ 确认下单",
    choose:"请选择菜品",
    empty:"🍽️ 购物车空，请勾选上方美食"
  },

  en:{
    menu:"🔥 Signature Roasted Menu",
    cart:"🛒 Shopping Cart",
    clear:"Clear Cart",
    submit:"✅ Place Order",
    choose:"Please Select Food",
    empty:"🍽️ Cart Empty"
  }
};

const langBtn =
document.getElementById('langToggleBtn');

langBtn.onclick=()=>{

  currentLang =
  currentLang==='cn' ? 'en' : 'cn';

  updateLanguage();
};

function updateLanguage(){

  document.getElementById('menuTitle')
  .innerText =
  langData[currentLang].menu;

  document.getElementById('cartTitle')
  .innerText =
  langData[currentLang].cart;

  clearCartBtn.innerText =
  langData[currentLang].clear;

  langBtn.innerText =
  currentLang==='cn'
  ? '🌐 English'
  : '🌐 中文';

  document.querySelectorAll('.menu-label')
  .forEach(label=>{

    const text =
    currentLang==='cn'
    ? label.dataset.cn
    : label.dataset.en;

    label.querySelector('span')
    .innerText = text;

    const checkbox =
    label.querySelector('input');

    checkbox.setAttribute(
      'data-name',

      currentLang==='cn'
      ? checkbox.dataset.nameCn
      : checkbox.dataset.nameEn
    );
  });

  renderCart();

  updateSubmitButtonState();
}

updateLanguage();

renderCart();

updateSubmitButtonState();

</script>

</body>
</html>
