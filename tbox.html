<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter 2 - PRO System</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
* { box-sizing: border-box; font-family: Arial; }
body { margin: 0; padding: 20px; }

body::before {
    content:""; position:fixed; width:100%; height:100%;
    background:url("https://images.unsplash.com/photo-1546069901-ba9599a7e63c") center/cover;
    opacity:0.65; z-index:-1;
}

#loginPage { max-width:400px; margin:150px auto; background:white; padding:25px; border-radius:12px; text-align:center; }
.container { max-width:900px; margin:auto; display:none; }

.order-box { background:white; padding:15px; margin-bottom:15px; border-radius:10px; }
.order-table { font-size:18px; font-weight:bold; color:#0066cc; }
.total { color:#27ae60; font-weight:bold; }

button { padding:6px 10px; margin:3px; border:none; border-radius:5px; }

.done-btn { background:#27ae60; color:white; }
.cancel-btn { background:#c0392b; color:white; }

.top-buttons { text-align:center; margin-bottom:15px; }

#newOrderAlert {
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:red;
color:white;
font-size:50px;
font-weight:bold;
z-index:9999;
justify-content:center;
align-items:center;
text-align:center;
}
</style>
</head>

<body>

<!-- 🔊 音效 -->
<audio id="dingSound" preload="auto"></audio>

<!-- 🚨 新订单弹窗 -->
<div id="newOrderAlert">🚨 NEW ORDER 🚨</div>

<div id="loginPage">
<h2>🔐 Login</h2>
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="error" style="color:red;"></p>
</div>

<div class="container" id="mainPage">

<h1>🍽️ Counter PRO System</h1>

<div class="top-buttons">
<button onclick="viewMode='current';loadOrders()">🟢 Current</button>
<button onclick="viewMode='history';loadOrders()">📜 History</button>
<button onclick="viewMode='cancelled';loadOrders()">❌ Cancelled</button>
<button onclick="toggleKitchenMode()">🍳 Kitchen Mode</button>
<button onclick="logout()">🚪 Logout</button>
</div>

<div id="orderList"></div>

</div>

<script>
const PASSWORD = "1234";
let viewMode = "current";
let lastOrderCount = 0;
let audioUnlocked = false;
let kitchenMode = false;

// 预加载音频
const orderAudio = document.getElementById("dingSound");

function login(){
    if(password.value === PASSWORD){
        loginPage.style.display="none";
        mainPage.style.display="block";

        // 修复正确音频链接
        orderAudio.src = "https://frops1997-create.github.io/restaurant-order/msz1.mp3";

        // 解锁音频
        orderAudio.play().then(() => {
            orderAudio.pause();
            orderAudio.currentTime = 0;
            audioUnlocked = true;
        }).catch(err => {
            audioUnlocked = true;
        });

        loadOrders();
    } else {
        error.innerText="Wrong Password!";
    }
}

function logout(){
    location.reload();
}

function triggerNewOrderAlert(){
    const box = document.getElementById("newOrderAlert");
    box.style.display="flex";

    // 播放三连提示音
    orderAudio.currentTime = 0;
    orderAudio.play();
    setTimeout(() => orderAudio.play(), 300);
    setTimeout(() => orderAudio.play(), 600);

    if(navigator.vibrate){
        navigator.vibrate([300,200,300]);
    }

    setTimeout(() => box.style.display="none", 3000);
}

function toggleKitchenMode(){
    kitchenMode=!kitchenMode;
    document.body.style.fontSize = kitchenMode ? "22px" : "16px";
    if(kitchenMode) autoScroll();
}

function autoScroll(){
    if(!kitchenMode) return;
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
    setTimeout(autoScroll,3000);
}

const firebaseConfig = {
apiKey:"AIzaSy...",
databaseURL:"https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function loadOrders(){
    let path="orders";
    if(viewMode==="history") path="historyOrders";
    if(viewMode==="cancelled") path="cancelledOrders";

    db.ref(path).on("value",snap=>{
        const data=snap.val();
        orderList.innerHTML="";

        let count=data?Object.keys(data).length:0;

        if(viewMode==="current" && count > lastOrderCount){
            triggerNewOrderAlert();
        }
        lastOrderCount = count;

        if(!data){ orderList.innerHTML="No Orders"; return;}

        for(let id in data){
            const o=data[id];

            let html="";
            let total=0;

            if(o.items){
                o.items.forEach(i=>{
                    let p=i.price||0;
                    total+=p;
                    html+=`${i.name} - $${p}<br>`;
                });
            }

            const div=document.createElement("div");
            div.className="order-box";

            div.innerHTML=`
            <div class="order-table">Order #${o.orderNo} | Table ${o.tableNo||"?"}</div>
            <div>📌 Status: ${o.status||"New"}</div>
            <div>${html}</div>
            <div class="total">Total: $${total}</div>
            <div>${o.time}</div>

            ${viewMode==="current"?`
            <button onclick="updateStatus('${id}','Preparing')">👨‍🍳 Preparing</button>
            <button onclick="updateStatus('${id}','Ready')">📦 Ready</button>
            <button class="done-btn" onclick="complete('${id}')">✅ Done</button>
            <button class="cancel-btn" onclick="cancelOrder('${id}')">❌ Cancel</button>
            `:""}
            `;

            orderList.appendChild(div);
        }
    });
}

function updateStatus(id,status){
    db.ref("orders/"+id+"/status").set(status);
}

function complete(id){
    db.ref("orders/"+id).once("value",s=>{
        db.ref("historyOrders/"+id).set(s.val());
        db.ref("orders/"+id).remove();
    });
}

function cancelOrder(id){
    db.ref("orders/"+id).once("value",s=>{
        db.ref("cancelledOrders/"+id).set(s.val());
        db.ref("orders/"+id).remove();
    });
}
</script>

</body>
</html>
