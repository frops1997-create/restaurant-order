<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBOX Counter</title>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<style>
* { box-sizing: border-box; font-family: Arial; }
body { margin: 0; padding: 20px; }
body::before {
    content:""; position:fixed; top:0; left:0; width:100%; height:100%;
    background:url("https://images.unsplash.com/photo-1546069901-ba9599a7e63c");
    background-size: cover; background-position: center;
    opacity:0.65; z-index:-1;
}
#loginPage { max-width:400px; margin:150px auto; background:white; padding:25px; border-radius:12px; text-align:center; }
#loginPage input { width:100%; padding:10px; margin:10px 0; }
#loginPage button { padding:10px 20px; }
.container { max-width:900px; margin:auto; display:none; }
.order-box { background:white; padding:15px; margin-bottom:15px; border-radius:10px; }
.order-table { font-size:18px; font-weight:bold; color:#0066cc; }
.total { color:#27ae60; font-weight:bold; font-size:16px; margin:8px 0; }
.done-btn { background:#27ae60; color:white; padding:6px 10px; border:none; }
.cancel-btn { background:#c0392b; color:white; padding:6px 10px; border:none; margin-left:5px; }
.top-buttons { text-align:center; margin-bottom:15px; }
.top-buttons button { margin:5px; padding:8px 12px; }
.summary { background:#fff; padding:10px 15px; border-radius:8px; margin-bottom:15px; font-size:18px; font-weight:bold; color:#d32f2f; }
.clear-btn { background:#e74c3c; color:white; padding:8px 12px; border:none; }
.logout-btn { background:#34495e; color:white; padding:8px 12px; border:none; }
.export-btn { background:#0277bd; color:white; padding:8px 12px; border:none; border-radius:4px; }
.modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index:999; display:none; }
.modal-box { background:white; padding:30px; border-radius:12px; max-width:400px; margin:150px auto; text-align:center; }
.modal-box input { width:100%; padding:12px; margin:15px 0; border:1px solid #ccc; border-radius:8px; }
.modal-btn { padding:10px 20px; margin:5px; border:none; border-radius:6px; }
.btn-confirm { background:#e74c3c; color:white; }
.btn-cancel { background:#95a5a6; color:white; }
</style>
</head>
<body>

<div id="loginPage">
    <h2>🔐 Login</h2>
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
</div>

<div class="modal-overlay" id="clearModal">
    <div class="modal-box">
        <h3>Clear History</h3>
        <input type="password" id="clearPwd" placeholder="Password">
        <div id="clearError" style="color:red; display:none;">Wrong Password!</div>
        <button class="modal-btn btn-confirm" onclick="verifyClearPwd()">Confirm</button>
        <button class="modal-btn btn-cancel" onclick="closeClearModal()">Cancel</button>
    </div>
</div>

<div class="container" id="mainPage">
    <h1>TBOX Food Only</h1>
    
    <div class="top-buttons">
        <button onclick="viewMode='current';loadOrders()">Current Orders</button>
        <button onclick="viewMode='history';loadOrders()">History</button>
        <button onclick="viewMode='cancelled';loadOrders()">Cancelled</button>
        <button class="export-btn" onclick="exportExcel()">Download Excel</button>
        <button class="clear-btn" onclick="openClearModal()">Clear History</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="summary" id="totalSummary">Total Amount: $0.00</div>
    <div id="orderList"></div>
</div>

<script>
const PASSWORD = "1234";
let viewMode = "current";
let lastOrderIds = [];
let currentAudio = null;

function playOrderMusic() {
    stopOrderMusic();
    currentAudio = new Audio('https://frops1997-create.github.io/restaurant-order/msz1.mp3');
    currentAudio.play().catch(e=>{});
}

function stopOrderMusic() {
    if(currentAudio) { currentAudio.pause(); currentAudio = null; }
}
document.addEventListener('click', stopOrderMusic);

function login(){
    if(document.getElementById("password").value === PASSWORD){
        loginPage.style.display="none";
        mainPage.style.display="block";
        loadOrders();
    } else {
        error.innerText="Wrong Password!";
    }
}

function logout(){
    if(confirm("Logout?")){
        mainPage.style.display="none";
        loginPage.style.display="block";
    }
}

function openClearModal(){ clearModal.style.display="block"; }
function closeClearModal(){ clearModal.style.display="none"; }

function verifyClearPwd(){
    if(document.getElementById("clearPwd").value === PASSWORD){
        db.ref("historyOrders").remove();
        db.ref("cancelledOrders").remove();
        closeClearModal();
    } else {
        clearError.style.display="block";
    }
}

const firebaseConfig = {
    apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
    authDomain: "restaurants-cs.firebaseapp.com",
    databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "restaurants-cs",
    storageBucket: "restaurants-cs.firebasestorage.app",
    messagingSenderId: "209872919844",
    appId: "1:209872919844:web:c1730801cd51d615e867b1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const priceList = {
    "TBOX Curry Chicken with Rice 咖喱鸡饭": 17.10,
    "TBOX Laksa Set 叻沙套餐": 16.90,
    "TBOX Traditional Kaya Toast Set 傳統咖椰吐司套裝": 8.50,
    "TBOX Traditional Butter Toast Set 傳統奶油吐司套裝": 8.20,
    "TBOX Ham and Cheese Sandwiches 火腿和起司三文治": 10.40,
    "Nasi Lemak Curry": 13,
    "TBOX Peanut Thick Toast Set 花生厚吐司套裝": 8.70,
    "TBOX Butter Suger Thick Toast 奶油糖厚吐司": 8.70,
    "TuTu Kueh (5pcs)Coconut 嘟嘟糕(5个)椰子": 6.30,
    "TuTu Kueh (5pcs)Peanut 嘟嘟糕(5个)花生": 6.30,
    "TuTu Kueh (5pcs)Plain 嘟嘟糕(5个)原味": 6.30
};

// ====================== 过滤：只显示 TBOX ======================
function isNormalFoodOrder(items) {
    if (!items || !Array.isArray(items)) return false;
    const tuTuKeywords = ["TBOX"];
    return items.some(item => {
        const itemName = typeof item === "object" ? (item.name || "") : item;
        return tuTuKeywords.some(keyword => itemName.includes(keyword));
    });
}

// 导出 Excel
function exportExcel() {
    db.ref("historyOrders").once("value", snap => {
        const data = snap.val();
        if (!data) { alert("No history to export!"); return; }

        let csv = "Order No,Table No,Amount,Time,Items\n";
        for (let id in data) {
            const o = data[id];
            if (!isNormalFoodOrder(o.items)) continue;

            let itemsStr = "";
            o.items.forEach(it => {
                const name = it.name || it;
                let price = it.price || 0;
                if (!price) for (let k in priceList) { if (name.includes(k)) { price = priceList[k]; break; } }
                itemsStr += `${name} ($${price.toFixed(2)}) | `;
            });
            csv += `"${o.orderNo}","${o.tableNo||'-'}","${o.total||0}","${o.time}","${itemsStr.slice(0,-3)}"\n`;
        }

        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = "TBOX_History.csv";
        a.click();
    });
}

// 加载订单
function loadOrders(){
    let path = viewMode === "history" ? "historyOrders" : viewMode === "cancelled" ? "cancelledOrders" : "orders";
    db.ref(path).on("value", snap=>{
        const data = snap.val();
        const list = document.getElementById("orderList");
        const summary = document.getElementById("totalSummary");

        list.innerHTML = "";
        let grandTotal = 0;

        if(!data) {
            list.innerHTML = "<div>No Orders</div>";
            summary.innerText = "Total Amount: $0.00";
            return;
        }

        const currentOrderIds = [];
        let hasNewOrder = false;

        for(let id in data){
            currentOrderIds.push(id);
            const o = data[id];
            if(!isNormalFoodOrder(o.items)) continue;

            if(viewMode==="current" && !lastOrderIds.includes(id)) hasNewOrder=true;

            let total = 0;
            let html = "";
            o.items.forEach(item=>{
                let name = item.name || item;
                let p = item.price || 0;
                if (!p) for (let k in priceList) { if (name.includes(k)) { p = priceList[k]; break; } }
                total += p;
                html += `${name} - $${p.toFixed(2)}<br>`;
            });

            grandTotal += total;

            list.innerHTML += `
            <div class="order-box">
                <div class="order-table">Order #${o.orderNo} | Table 2255</div>
                <div>${html}</div>
                <div class="total">Total: $${total.toFixed(2)}</div>
                <div>${o.time}</div>
                ${viewMode==="current" ? `
                <button class="done-btn" onclick="complete('${id}')">Complete</button>
                <button class="cancel-btn" onclick="cancelOrder('${id}')">Cancel</button>
                ` : ""}
            </div>`;
        }

        summary.innerText = `Total Amount: $${grandTotal.toFixed(2)}`;
        if(viewMode==="current" && hasNewOrder) playOrderMusic();
        lastOrderIds = currentOrderIds;
    });
}

function complete(id){
    if(confirm("Complete Order?")){
        db.ref("Orders/"+id).once("value",s=>{
            db.ref("historyOrders/"+id).set(s.val());
            db.ref("Orders/"+id).remove();
        });
    }
}

function cancelOrder(id){
    if(confirm("Cancel Order?")){
        db.ref("Orders/"+id).once("value",s=>{
            db.ref("cancelledOrders/"+id).set(s.val());
            db.ref("Orders/"+id).remove();
        });
    }
}
</script>
</body>
</html>
