<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen TBOX System</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
body {
 margin:0;
 background:#111;
 color:white;
 font-family:Arial;
}

.topbar {
 padding:15px;
 text-align:center;
 background:black;
}

.order-container {
 display:flex;
 flex-wrap:wrap;
 gap:15px;
 padding:15px;
}

.order-card {
 background:#222;
 padding:15px;
 border-radius:10px;
 width:260px;
}

.order-title {
 font-size:20px;
 font-weight:bold;
 color:#00c3ff;
}

.item {
 font-size:18px;
 margin:5px 0;
}

.total {
 color:#2ecc71;
 font-weight:bold;
}

button {
 margin-top:8px;
 padding:6px 10px;
 border:none;
 border-radius:5px;
 cursor:pointer;
}

.done { background:#27ae60; color:white; }
.cancel { background:#c0392b; color:white; }

#alertScreen {
 display:none;
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:100%;
 background:red;
 color:white;
 font-size:60px;
 font-weight:bold;
 z-index:9999;
 justify-content:center;
 align-items:center;
 text-align:center;
 animation:flash 0.6s infinite;
}

@keyframes flash {
 0% { opacity:1 }
 50% { opacity:0.3 }
 100% { opacity:1 }
}

.enable {
 position:fixed;
 top:10px;
 right:10px;
 z-index:999;
}
</style>
</head>

<body>

<button class="enable" onclick="enableSound()">🔊 Enable Sound</button>

<div id="alertScreen" onclick="stopAlert()">
🚨 NEW ORDER 🚨<br>CLICK TO STOP
</div>

<div class="topbar">
<h2>🍳 Tu Tu Kueh </h2>
</div>

<div class="order-container" id="orders"></div>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyD...",
 databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let lastCount = 0;
let firstLoad = true;
let soundEnabled = false;
let alarmLoop = null;

const audio = new Audio("https://frops1997-create.github.io/restaurant-order/msz1.mp3");

// 🔊 解锁声音
function enableSound(){
 audio.play().then(()=>{
  audio.pause();
  audio.currentTime=0;
  soundEnabled=true;
  alert("Sound Enabled ✅");
 });
}

// 🚨 报警
function triggerAlert(){
 if(!soundEnabled) return;

 document.getElementById("alertScreen").style.display="flex";

 alarmLoop = setInterval(()=>{
  audio.currentTime=0;
  audio.play().catch(()=>{});
 },700);
}

// ⛔ 停止
function stopAlert(){
 document.getElementById("alertScreen").style.display="none";

 if(alarmLoop){
  clearInterval(alarmLoop);
  alarmLoop=null;
 }
 audio.pause();
 audio.currentTime=0;
}

// 📦 监听订单
db.ref("orders").on("value", snap=>{
 const data = snap.val();
 const container = document.getElementById("orders");
 container.innerHTML="";

 let list=[];
 if(data){
  for(let id in data){
   list.push({id,data:data[id]});
  }
 }

 let count = list.length;

 if(!firstLoad && count > lastCount){
  triggerAlert();
 }

 lastCount = count;
 firstLoad = false;

 list.forEach(({id,data:o})=>{
  let total=0;
  let itemsHTML="";

  if(o.items){
   o.items.forEach(i=>{
    total+=i.price||0;
    itemsHTML += `<div class="item">${i.name}</div>`;
   });
  }

  const div=document.createElement("div");
  div.className="order-card";

  div.innerHTML=`
   <div class="order-title">#${o.orderNo} | Table ${o.tableNo}</div>
   ${itemsHTML}
   <div class="total">Total: $${total}</div>
   <button class="done" onclick="complete('${id}')">DONE</button>
   <button class="cancel" onclick="cancelOrder('${id}')">CANCEL</button>
  `;

  container.appendChild(div);
 });

});

// ✅ 完成
function complete(id){
 db.ref("orders/"+id).once("value",s=>{
  db.ref("historyOrders/"+id).set(s.val());
  db.ref("orders/"+id).remove();
 });
}

// ❌ 取消
function cancelOrder(id){
 db.ref("orders/"+id).once("value",s=>{
  db.ref("cancelledOrders/"+id).set(s.val());
  db.ref("orders/"+id).remove();
 });
}

// 🔄 自动滚动
setInterval(()=>{
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
},3000);
</script>

</body>
</html>
