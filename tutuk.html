<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuTu Kueh Pro Counter</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        :root { --primary: #0066cc; --success: #27ae60; --danger: #c0392b; --dark: #34495e; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { margin: 0; padding: 20px; min-height: 100vh; background-color: #f4f7f6; }
        
        /* Background Decoration */
        body::before {
            content:""; position:fixed; top:0; left:0; width:100%; height:100%;
            background:url("https://unsplash.com") center/cover no-repeat;
            opacity:0.1; z-index:-1;
        }

        /* Login Section */
        #loginPage { max-width:400px; margin:100px auto; background:white; padding:30px; border-radius:15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align:center; }
        input { width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; outline:none; font-size: 16px; }
        
        /* Buttons */
        button { cursor: pointer; transition: 0.3s; border: none; border-radius: 6px; font-weight: bold; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }
        .btn-main { width:100%; background:var(--primary); color:white; padding:12px; font-size: 16px; }
        
        /* Container & Header */
        .container { max-width:800px; margin:auto; display:none; }
        .top-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .top-buttons button { padding: 10px 15px; background: white; border: 1px solid #ddd; color: #555; }
        .top-buttons button.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* Order Card Style */
        .order-box { background:white; padding:20px; margin-bottom:15px; border-radius:12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .order-table { font-size:20px; font-weight:bold; color:var(--primary); }
        .item-list { line-height: 1.8; margin: 10px 0; font-size: 17px; }
        .total { color:var(--success); font-weight:bold; font-size:18px; margin:10px 0; }
        .time { font-size: 12px; color: #888; }
        
        /* Action Buttons */
        .action-btns { margin-top: 15px; display: flex; gap: 10px; }
        .done-btn { background:var(--success); color:white; flex: 2; padding: 12px; }
        .cancel-btn { background:var(--danger); color:white; flex: 1; padding: 12px; }
        .clear-btn { background:var(--danger); color:white; }
        .logout-btn { background:var(--dark); color:white; }

        /* Modal */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); z-index:999; display:none; }
        .modal-box { background:white; padding:30px; border-radius:12px; max-width:400px; margin:100px auto; text-align:center; }
    </style>
</head>
<body>

<!-- Audio Notification -->
<audio id="notifSound" src="https://mixkit.co" preload="auto"></audio>

<div id="loginPage">
    <h2 style="margin-top:0;">🍴 TuTu Kueh CMS</h2>
    <p style="color:#666;">Enter Counter Access Code</p>
    <input type="password" id="password" placeholder="Password">
    <button class="btn-main" onclick="login()">Enter System</button>
    <p id="error" style="color:red; margin-top:10px;"></p>
</div>

<div class="modal-overlay" id="clearModal">
    <div class="modal-box">
        <h3>🔐 Admin Authorization</h3>
        <p>Type password to wipe history records</p>
        <input type="password" id="clearPwd" placeholder="Enter Password">
        <div id="clearError" style="color:red; display:none; margin-bottom:10px;">Access Denied</div>
        <button style="background:var(--danger); color:white; padding:10px 20px; margin: 5px;" onclick="verifyClearPwd()">Confirm Wipe</button>
        <button style="background:#ccc; padding:10px 20px; margin: 5px;" onclick="closeClearModal()">Cancel</button>
    </div>
</div>

<div class="container" id="mainPage">
    <h1 style="text-align: center; color: var(--dark); margin-bottom: 25px;">TuTu Kueh Terminal</h1>
    <div class="top-buttons">
        <button id="btn-current" onclick="switchMode('current')">🟢 Active</button>
        <button id="btn-history" onclick="switchMode('history')">📜 Finished</button>
        <button id="btn-cancelled" onclick="switchMode('cancelled')">❌ Cancelled</button>
        <button class="clear-btn" onclick="openClearModal()">🗑️ Clear History</button>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
    <div id="orderList"></div>
</div>

<script>
const PASSWORD = "1234";
let viewMode = "current";
let lastOrderCount = -1; // Track count for sound notifications

// Firebase Configuration
const firebaseConfig = {
    apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
    authDomain: "://firebaseapp.com",
    databaseURL: "https://firebasedatabase.app",
    projectId: "restaurants-cs",
    storageBucket: "restaurants-cs.firebasestorage.app",
    messagingSenderId: "209872919844",
    appId: "1:209872919844:web:c1730801cd51d615e867b1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function login(){
    if(document.getElementById("password").value === PASSWORD){
        // Unlock Audio Context for Browser
        const sound = document.getElementById("notifSound");
        sound.play().then(() => { sound.pause(); sound.currentTime = 0; }).catch(()=>{});

        document.getElementById("loginPage").style.display="none";
        document.getElementById("mainPage").style.display="block";
        switchMode('current');
    } else {
        document.getElementById("error").innerText="Invalid Access Code";
    }
}

function logout(){
    if(confirm("Exit system?")){ location.reload(); }
}

function switchMode(mode) {
    viewMode = mode;
    document.querySelectorAll('.top-buttons button').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${mode}`).classList.add('active');
    loadOrders();
}

function isTuTuKuehOrder(items) {
    if (!items || !Array.isArray(items)) return false;
    const keywords = ["TuTu Kueh", "嘟嘟糕"];
    return items.some(item => {
        const name = typeof item === "object" ? (item.name || "") : item;
        return keywords.some(k => name.includes(k));
    });
}

function playNotification() {
    const sound = document.getElementById("notifSound");
    sound.play().catch(e => console.log("Sound blocked"));
}

function loadOrders(){
    let path = viewMode === "current" ? "orders" : (viewMode === "history" ? "historyOrders" : "cancelledOrders");
    
    db.ref(path).off(); 
    db.ref(path).on("value", snap => {
        const data = snap.val();
        
        // --- Sound Alert Logic ---
        if (viewMode === "current") {
            let currentValidOrders = 0;
            if (data) {
                currentValidOrders = Object.values(data).filter(o => isTuTuKuehOrder(o.items)).length;
            }
            if (lastOrderCount !== -1 && currentValidOrders > lastOrderCount) {
                playNotification();
            }
            lastOrderCount = currentValidOrders;
        }

        const list = document.getElementById("orderList");
        list.innerHTML = "";
        
        if(!data) {
            list.innerHTML = "<div style='text-align:center; padding:50px; color:#888;'>No orders found.</div>";
            return;
        }

        const entries = Object.entries(data).reverse();
        let count = 0;

        entries.forEach(([id, o]) => {
            if (!isTuTuKuehOrder(o.items)) return;
            count++;

            let itemsHtml = "";
            let calculatedTotal = 0;
            
            o.items.forEach(item => {
                const name = item.name || item;
                const price = parseFloat(item.price || 0);
                calculatedTotal += price;
                itemsHtml += `<div>• ${name} <span style="float:right; color:#666;">$${price.toFixed(2)}</span></div>`;
            });

            const displayTotal = o.total ? parseFloat(o.total) : calculatedTotal;
            const table = o.tableNo || o.TableNo || "N/A";

            const div = document.createElement("div");
            div.className = "order-box";
            div.innerHTML = `
                <div class="order-header">
                    <span class="order-table">TABLE ${table}</span>
                    <span style="font-weight:bold; color:#999; font-size:14px;">#${o.orderNo || id.slice(-4)}</span>
                </div>
                <div class="item-list">${itemsHtml}</div>
                <div class="total">Total Bill: $${displayTotal.toFixed(2)}</div>
                <div class="time">🕒 Received: ${o.time || 'Unknown'}</div>
                ${viewMode === "current" ? `
                    <div class="action-btns">
                        <button class="done-btn" onclick="moveOrder('${id}', 'historyOrders')">✅ MARK AS DONE</button>
                        <button class="cancel-btn" onclick="moveOrder('${id}', 'cancelledOrders')">❌ CANCEL</button>
                    </div>
                ` : ""}
            `;
            list.appendChild(div);
        });

        if (count === 0) list.innerHTML = "<div style='text-align:center; padding:50px; color:#888;'>No TuTu Kueh orders here.</div>";
    });
}

function moveOrder(id, targetPath) {
    const actionName = targetPath === 'historyOrders' ? "complete" : "cancel";
    if(!confirm(`Confirm ${actionName} order?`)) return;

    db.ref("orders/" + id).once("value", snap => {
        const val = snap.val();
        if(val) {
            db.ref(targetPath + "/" + id).set(val, (err) => {
                if(!err) db.ref("orders/" + id).remove();
            });
        }
    });
}

function openClearModal() { document.getElementById("clearModal").style.display = "block"; }
function closeClearModal() { document.getElementById("clearModal").style.display = "none"; }

function verifyClearPwd() {
    if (document.getElementById("clearPwd").value === PASSWORD) {
        if(confirm("Delete all history and cancelled records? This cannot be undone.")) {
            db.ref("historyOrders").remove();
            db.ref("cancelledOrders").remove();
            closeClearModal();
            alert("Records Cleared.");
        }
    } else {
        document.getElementById("clearError").style.display = "block";
    }
}
</script>
</body>
</html>
