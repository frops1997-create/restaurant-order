<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter 1 - TuTu Kueh Only</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
* { box-sizing: border-box; font-family: Arial; }
body { margin: 0; padding: 20px; }

/* 🔴 红色警报 */
#alarmOverlay{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:red;
    opacity:0.85;
    z-index:9999;
    display:none;
    animation: flash 0.6s infinite;
}
@keyframes flash {
    0%{opacity:0.2;}
    50%{opacity:0.9;}
    100%{opacity:0.2;}
}

body::before {
    content:""; position:fixed; width:100%; height:100%;
    background:url("https://images.unsplash.com/photo-1546069901-ba9599a7e63c") center/cover;
    opacity:0.65; z-index:-1;
}

#loginPage { max-width:400px; margin:150px auto; background:white; padding:25px; border-radius:12px; text-align:center; }
#loginPage input { width:100%; padding:10px; margin:10px 0; }
#loginPage button { padding:10px 20px; }

.container { max-width:900px; margin:auto; display:none; }
.order-box { background:white; padding:15px; margin-bottom:15px; border-radius:10px; }
.order-table { font-size:18px; font-weight:bold; color:#0066cc; }
.total { color:#27ae60; font-weight:bold; font-size:16px; margin:8px 0; }

.done-btn { background:#27ae60; color:white; padding:6px 10px; border:none; }
.cancel-btn { background:#c0392b; color:white; padding:6px 10px; border:none; margin-left:5px; }

.top-buttons { text-align:center; margin-bottom:15px; }
.top-buttons button { margin:5px; padding:8px 12px; }

.clear-btn { background:#e74c3c; color:white; }
.logout-btn { background:#34495e; color:white; }
.export-btn { background:#2980b9; color:white; }

</style>
</head>

<body>

<!-- 🔴 警报层 -->
<div id="alarmOverlay" onclick="stopAlarm()"></div>

<!-- 🔊 音效 -->
<audio id="alarmSound" loop>
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<div id="loginPage">
    <h2>🔐 Counter Login</h2>
    <input type="password" id="password">
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
</div>

<div class="container" id="mainPage">
    <h1>Tu Tu Kueh</h1>

    <div class="top-buttons">
        <button onclick="viewMode='current';loadOrders()">🟢 Current</button>
        <button onclick="viewMode='history';loadOrders()">📜 History</button>
        <button onclick="viewMode='cancelled';loadOrders()">❌ Cancelled</button>
        <button class="export-btn" onclick="exportExcel()">📊 Export Excel</button>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>

    <div id="orderList"></div>
</div>

<script>
const PASSWORD = "1234";
let viewMode = "current";
let lastOrderCount = 0; // 🔥 用来检测新订单

function login(){
    if(password.value === PASSWORD){
        loginPage.style.display="none";
        mainPage.style.display="block";
        loadOrders();
    }else{
        error.innerText="Wrong Password!";
    }
}

function logout(){
    mainPage.style.display="none";
    loginPage.style.display="block";
}

/* 🔊 播放警报 */
function triggerAlarm(){
    document.getElementById("alarmOverlay").style.display="block";
    document.getElementById("alarmSound").play();
}

/* 🛑 停止警报 */
function stopAlarm(){
    document.getElementById("alarmOverlay").style.display="none";
    const audio = document.getElementById("alarmSound");
    audio.pause();
    audio.currentTime = 0;
}

/* Firebase */
const firebaseConfig = {
    apiKey: "AIzaSy...",
    databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 过滤 TuTu */
function isTuTuKuehOrder(items){
    if (!items) return false;
    return items.some(i=>{
        const name = i.name || i;
        return name.includes("TuTu Kueh");
    });
}

function loadOrders(){
    let path="orders";
    if(viewMode==="history") path="historyOrders";
    if(viewMode==="cancelled") path="cancelledOrders";

    db.ref(path).on("value", snap=>{
        const data = snap.val();
        const list = document.getElementById("orderList");
        list.innerHTML="";

        let count = 0;

        if(data){
            for(let id in data){
                const o = data[id];
                if(!isTuTuKuehOrder(o.items)) continue;

                count++;

                let total = o.total || 0;
                let html="";

                o.items.forEach(i=>{
                    html += `${i.name} - $${i.price}<br>`;
                });

                const div=document.createElement("div");
                div.className="order-box";
                div.innerHTML=`
                    <div class="order-table">Order #${o.orderNo}</div>
                    <div>${html}</div>
                    <div class="total">$${total}</div>
                    ${viewMode==="current" ? `
                    <button onclick="complete('${id}')">✅ Done</button>
                    <button onclick="cancelOrder('${id}')">❌ Cancel</button>` : ""}
                `;
                list.appendChild(div);
            }
        }

        /* 🔥 新订单检测 */
        if(viewMode==="current" && count > lastOrderCount){
            triggerAlarm();
        }
        lastOrderCount = count;
    });
}

function complete(id){
    db.ref("orders/"+id).once("value",s=>{
        db.ref("historyOrders/"+id).set(s.val());
        db.ref("orders/"+id).remove();
    });
}

function cancelOrder(id){
    db.ref("orders/"+id).once("value",s=>{
        db.ref("cancelledOrders/"+id).set(s.val());
        db.ref("orders/"+id).remove();
    });
}

/* 📊 导出 Excel */
function exportExcel(){
    db.ref("historyOrders").once("value",snap=>{
        const data = snap.val();
        if(!data){ alert("No data"); return;}

        let csv="OrderNo,Total,Time\n";

        for(let id in data){
            const o = data[id];
            csv += `${o.orderNo},${o.total},${o.time}\n`;
        }

        const blob = new Blob([csv], {type:"text/csv"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "orders.csv";
        a.click();
    });
}
</script>

</body>
</html>
