<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Food Order - Tu Tu Kueh</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background-image: url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #f8f9fa;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .menu-box {
    width: 380px;
    padding: 30px;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 16px;
    font-weight: bold;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  }

  /* --- Added Back Button Style --- */
  .back-home {
    display: inline-block;
    text-decoration: none;
    background: #6c757d;
    color: white;
    padding: 8px 15px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 20px;
    transition: background 0.3s;
  }
  .back-home:hover {
    background: #495057;
  }

  .order-confirm {
    background: rgba(0, 150, 0, 0.8);
    color: white;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    font-size: 16px;
    text-align: center;
    display: none;
  }

  label {
    display: block;
    margin: 8px 0;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  button:disabled {
    background: #cccccc;
    cursor: not-allowed;
  }

  button:hover:not(:disabled) {
    background: #0056b3;
  }

  #kitchenSection, #qrSection {
    display: none;
  }

  .order {
    border: 1px solid #ccc;
    padding: 10px;
    margin: 10px 0;
    background: white;
  }
</style>
</head>

<body>

<div class="menu-box">
  <!-- Back Button Link -->
  <a href="https://frops1997-create.github.io/restaurant-order/Main.html" class="back-home">← Back to Home(返回主页)</a>

  <h2>Tu Tu Kueh</h2>
  <p>Table: <span id="tableNo"></span></p>

 <h3>Menu</h3>
  <label><input type="checkbox" data-price="6.30" onchange="updateTotal()"> 1) TuTu Kueh (5pcs)Coconut 嘟嘟糕(5个)椰子 -$6.30</label>
  <label><input type="checkbox" data-price="6.30" onchange="updateTotal()"> 2) TuTu Kueh (5pcs)Peanut 嘟嘟糕(5个)花生 -$6.30</label>
  <label><input type="checkbox" data-price="6.30" onchange="updateTotal()"> 3) TuTu Kueh (5pcs)Plain 嘟嘟糕(5个)原味 -$6.30</label>
   <button id="submitBtn" onclick="submitOrder()">Submit Order</button>
  <p id="total">Total: $0.00</p>

  <div class="order-confirm" id="orderConfirm">
    <h3>Order Submitted!</h3>
    <p>Order No: <span id="showOrderNo"></span></p>
    <p>Table: <span id="showTable"></span></p>
    <p>Total: $<span id="showTotal"></span></p>
    <small>Please wait for your food</small>
  </div>
</div>

<div id="kitchenSection">
  <h2>Kitchen Orders</h2>
  <div id="orders"></div>
</div>

<div id="qrSection">
  <h2>Table QR</h2>
  <input type="number" id="tableInput" placeholder="Table No">
  <button onclick="generateQR()">Generate QR</button>
  <div id="qrcode"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDrrk3exoaA4PjYVlNnlIr1-qZcHYfXZtk",
  authDomain: "restaurants-cs.firebaseapp.com",
  databaseURL: "https://restaurants-cs-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "restaurants-cs",
  storageBucket: "restaurants-cs.firebasestorage.app",
  messagingSenderId: "209872919844",
  appId: "1:209872919844:web:c1730801cd51d615e867b1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(location.search);
const isKitchen = params.get('kitchen');
const isAdmin = params.get('admin');

const table = 1;

if (!isKitchen) document.getElementById('kitchenSection').style.display = 'none';
if (!isAdmin) document.getElementById('qrSection').style.display = 'none';
document.getElementById('tableNo').textContent = table;

let currentOrderNo = 1;

db.ref('orderCounter').once('value').then(snap => {
  if(snap.val()){
    currentOrderNo = snap.val();
  }
});

function updateTotal() {
  let total = 0;
  document.querySelectorAll('input:checked').forEach(i => total += parseFloat(i.dataset.price));
  document.getElementById('total').innerText = `Total: $${total.toFixed(2)}`;
}

function submitOrder() {
  const btn = document.getElementById('submitBtn');
  if (btn.disabled) return;

  const items = Array.from(document.querySelectorAll('input:checked'));
  if (items.length === 0) {
    alert('Please select food!');
    return;
  }

  btn.disabled = true;
  btn.innerText = "Order Sent";

  let total = 0;
  let list = [];
  items.forEach(i => {
    total += parseFloat(i.dataset.price);
    list.push(i.nextSibling.textContent.trim());
  });

  const orderNo = currentOrderNo;
  currentOrderNo++;
  db.ref('orderCounter').set(currentOrderNo);

  db.ref('orders').push({
    orderNo: orderNo,
    table: table,
    items: list,
    total: total.toFixed(2),
    time: new Date().toLocaleTimeString()
  });

  document.getElementById('showOrderNo').innerText = orderNo;
  document.getElementById('showTable').innerText = table;
  document.getElementById('showTotal').innerText = total.toFixed(2);
  document.getElementById('orderConfirm').style.display = 'block';
}

function loadOrders() {
  db.ref('orders').on('value', snap => {
    const data = snap.val();
    const out = document.getElementById('orders');
    out.innerHTML = '';
    if (!data) { out.innerHTML = '<p>No orders</p>'; return; }

    for (let id in data) {
      const o = data[id];
      const div = document.createElement('div');
      div.className = 'order';
      div.innerHTML = `<b>Order #${o.orderNo}</b><br><b>Table ${o.table}</b><br>Total: $${o.total}<br>${o.items.join(', ')}<br>${o.time}<br>
      <button onclick="completeOrder('${id}')">Done</button>`;
      out.appendChild(div);
    }
  });
}

function completeOrder(id) {
  db.ref('orders/'+id).remove();
}

function generateQR() {
  const t = document.getElementById('tableInput').value;
  if (!t) { alert('Enter table!'); return; }
  QRCode.toCanvas(document.getElementById('qrcode'), `${location.origin}${location.pathname}?table=${t}`, {width:180});
}

loadOrders();
</script>

</body>
</html>
